---
# Agent LXC (agent-lxc) — fleet observer
#
# Tier 1 (this file, Phase A): a shell sweep over every host via the
# container-resident read_agent key. Free, hourly, no AI involved.
#
# Tier 2 (Phase B): an agent runtime that explains Tier 1 anomalies.
# Its toggles are declared here, defaulted off, so enabling them later is a
# variable flip rather than a structural change.

# Services
enable_agent: true

# ansible_host is the literal IP (see hosts.yml) rather than a name: the
# container gets a static address from `pct create`, so it never appears in a
# DHCP lease, and DNS for it is a separate manual override on the gateway.

# Firewall — deliberately stricter than the sibling LXCs.
# This box only ever initiates connections; nothing but SSH needs to reach it,
# and it holds a key trusted by all 7 hosts. bootstrap.yml allows tcp/22
# before enabling UFW, so there is no lockout path.
#
# enable_ufw is set on the host entry in hosts.yml, NOT here. This file is
# loaded by services.yml via include_vars, which happens after bootstrap.yml
# has already decided whether to install and enable ufw.

# ============================================================
# Tier 1 — fleet health sweep
# ============================================================

# Hosts the sweep checks, by their SSH name (not the inventory key).
# Reached as <name>-agent, which resolves via the ~/.ssh/config deployed by
# the agent role. Keep in sync with hosts.yml.
#
# `kind` selects which probes run, because the checks are not portable:
#   linux    — disk, failed systemd units, monitoring-cron freshness
#   proxmox  — linux checks plus zpool health and CT/VM run state
#   opnsense — disk, default route and monitoring freshness over the HTTPS
#              API. The only kind that never opens an SSH connection.
agent_fleet_hosts:
  - name: cobra
    kind: linux
  - name: dockassist
    kind: linux
  - name: hifipi
    kind: linux
  - name: vinylstreamer
    kind: linux
  - name: unifi
    kind: linux
  - name: cwwk
    kind: proxmox
  - name: opnsense
    kind: opnsense

# Disk usage percentage at or above which a host is flagged.
agent_disk_threshold: 85

# A host whose own monitoring has silently stopped is worth an alert in its
# own right. The plan called for reading the wrapper's state file, but that
# lives under the primary user's 0700 home and read_agent cannot see it
# (verified on cobra). The journal records every wrapper invocation cron
# makes, is readable via the existing sudo rules, and answers the same
# question — "did this host's monitoring actually run recently?"
agent_wrapper_max_age_hours: 26

# Per-host SSH timeout for the sweep. Kept short: an unreachable host should
# be reported quickly, not stall the whole run.
agent_ssh_timeout: 15

# ============================================================
# Phase B — OpenCode runtime and Tier 2 investigation
# ============================================================

enable_agent_investigate: true

# Per-agent, provider-qualified models. Switching provider is a change here
# plus a redeploy — no code change — which is what makes an open-weight A/B
# cheap to run. See docs/ARCHITECTURE_DECISIONS.md.
#
# Investigation drives real diagnosis a human acts on, so it runs on Sonnet 5.
# The earlier Haiku choice optimized a tier where cost barely matters:
# investigations are 1-3/day, so Sonnet costs ~$0.30-0.60/mo more — noise —
# while being materially better at cross-host correlation and root cause.
# Haiku confirmed non-issues fine but is shallow on real root cause.
# small_model (session titles, incidental) stays cheap.
agent_monitor_model: "anthropic/claude-sonnet-5"
agent_digest_model: "anthropic/claude-sonnet-5"
agent_small_model: "anthropic/claude-haiku-4-5"

# ============================================================
# Internet speed measurement — the VPN path (docs/TODO.md item 1d)
# ============================================================

# This host is the VLAN 40 end of the VPN-vs-direct comparison. dockassist sits
# on VLAN 100 and egresses direct; this container egresses through Mullvad, so
# until now the tunnelled path was entirely unmeasured and a degrading tunnel
# would have been invisible.
#
# ✅ Proven on 2026-09-05 before this was enabled: 930.58/935.32 Mbps against
# dockassist's 940.94/940.11 on the same pinned server, with the egress
# confirmed as Mullvad (AS 31173 Services AB, 193.32.249.134 vs dockassist's
# 87.210.114.214). It saturates, so it measures the tunnel and not its own NIC.
enable_internet_speed_check: true

# 🔴 :37, NOT :07 — dockassist runs at :07 and the two share one WAN link.
# Concurrent saturation tests measure each other rather than the line; that is
# what produced the bogus 250 Mbps reading on 2026-08-19. Thirty minutes apart
# is comfortably clear of a ~190 s run.
internet_speed_minute: "37"
internet_speed_hour: "3,15"

# Same server as dockassist, on purpose. Ookla picks relative to the EGRESS, so
# an unpinned test here would choose near the Mullvad exit while dockassist
# chose near Odido — comparing two different measurements and reporting the
# difference as "VPN slowness".
internet_speed_server_id: 52365
internet_speed_tests: 3
internet_speed_delay: 75

# ⚠️ A LOOSE ABSOLUTE FLOOR, deliberately — this is not the ratio alert.
#
# The ratio alert item 1d specifies cannot be set yet: there are exactly two
# ratio samples (94% on 2026-08-19, 99% on 2026-09-05), taken 17 days apart by
# different methods. A threshold drawn from two points is a guess, and this repo
# has already paid for a one-sample baseline once — it gave the entity-health
# check three false misses in four days.
#
# So: measure now, alert on the ratio later. 700 Mbps is ~75% of line rate and
# catches a genuinely broken tunnel from day one, which is strictly better than
# today, where nothing watches this path at all. Set the real ratio threshold
# from a fortnight of observed variance, not from these two numbers.
internet_speed_min_download: 700
internet_speed_min_upload: 700
# Idle latency measured 5.56 ms here vs 4.12 ms direct; 30 leaves room for
# ordinary tunnel variation without paging on it.
internet_speed_max_ping: 30

# Distinct names so the two paths are told apart in #home-logging and in the
# wrapper's state files, and so each keeps its own log.
internet_speed_cron_name: "Internet speed check (VPN path)"
internet_speed_monitoring_name: "internet_speed_check_vpn"
