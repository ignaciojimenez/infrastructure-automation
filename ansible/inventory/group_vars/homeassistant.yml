---
# Home Assistant function vars
# Override ha_* person variables in group_vars/all/main.yml or host_vars/ for your setup.

# Services
enable_docker: true
enable_homeassistant: true
# NOTE: enable_cloudflare_tunnel and ha_* person entity variables are intentionally
# NOT defined here. Set them in group_vars/all/main.yml (native group_vars, precedence 3)
# to ensure they correctly override role defaults (precedence 1). If defined here via
# include_vars they would take precedence 17 and override main.yml (precedence 3).

# Hardware (auto-skipped on test environments)
disable_modemmanager: true

# Backup
enable_homeassistant_backup: true
homeassistant_backup_frequency: "daily"
homeassistant_backup_retention_days: 7

# Container
homeassistant_container_name: "home-assistant"
homeassistant_config_dir: "/home/{{ ansible_user }}/homeassistant"

# Internet Speed Monitoring
enable_internet_speed_check: true
internet_speed_min_download: 850
internet_speed_min_upload: 850
internet_speed_max_ping: 15
internet_speed_tests: 5
internet_speed_delay: 75

# Platform
# Nothing on this host uses Bluetooth: HA's adapter discovery is dismissed
# (source: "ignore"), bluetooth.service is disabled and inactive, hci0 is
# DOWN, and matter-server runs without --bluetooth-adapter so it never does
# BLE commissioning. Commissioning via the companion app uses the phone's
# radio and is unaffected. Verified 2026-08-22.
disable_bluetooth: true
disable_hdmi: true

# ── vinylstreamer watchdog ────────────────────────────────────────────────────
# vinylstreamer stays up but drops off wifi: NetworkManager gives up after 4
# retries and goes silent (measured 3.6 days, 09–13 Aug 2026). The only known
# remediation is a power cycle, which Ignacio was performing by hand from the
# Shelly app (13 Aug 18:09, 15 Aug 11:08). This automates that step.
#
# HA owns the plug deliberately — the unattended agent tier must not be able to
# hard-reset a host. See docs/TODO.md "L-I / W2".
#
# ⚠️ This is REMEDIATION, NOT A DIAGNOSIS. The plug hides the fault by design, so
# the same config below makes it impossible to hide *silently*: every cycle pages
# #home-alerts, and a rising 7-day cycle count escalates on its own. The root
# cause is W1 in ~/.claude/plans/vinylstreamer-wifi-lockout-plan.md.
enable_vinylstreamer_watchdog: true

# IP, not hostname: fleet name resolution is mDNS-only (docs/NETWORK.md) and
# avahi withdraws its records the moment wlan0 drops, so a name-based probe
# conflates "host gone" with "name gone".
vinylstreamer_ip: "10.30.100.110"

# Shelly Plug S Gen3 at 10.30.100.217 ("shelly plug vinyl streamer").
# Device settings NOT managed here (they live in the plug's own flash):
#   initial_state: on                  ← so the plug is not a new SPOF after a cut
#   autorecover_voltage_errors: true   ← so a mains transient cannot latch it off
# Both verified on the device 2026-08-16.
vinylstreamer_plug_entity: "switch.shellyplugsg3_48f6eeb67ae4"

# 15 min: long enough that bgscan hiccups and a normal reboot never reach it
# (the Pi boots in well under 2 min); short enough to beat a multi-day lockout.
vinylstreamer_down_after_minutes: 15
# 15 s off: a Pi PSU's capacitors will ride out a shorter cut.
vinylstreamer_power_cycle_seconds: 15
# At most one cycle per hour. A plug that reboots a Pi in a loop is a worse
# failure than the one it fixes — but this is a rate limit, not a veto.
#
# Was 6 h until 2026-08-23, when the cooldown was only ever evaluated on the
# down-transition and therefore *cancelled* a cycle rather than postponing it.
# Lowered to 1 h now that a time_pattern re-check actually retries: 6 h was
# sized for "the one chance we get", and with a real retry it just means a
# music streamer stays dead most of the night (measured: the 01:58 drop would
# have waited until 07:45). The anti-loop concern is about *rapid* cycling,
# and vinylstreamer_cycles_7d_escalate below already catches the crutch case.
vinylstreamer_cycle_cooldown_hours: 1
# Anti-masking: more than this many cycles in 7 days means the plug has stopped
# being a safety net and started being a crutch. Escalates to #home-alerts.
vinylstreamer_cycles_7d_escalate: 3

# Lights — members of the `light.all_lights` group used by automations and dashboards
homeassistant_lights:
  - light.floor_lamp
  - light.book_floor_lamp
  - light.table_lamp
  - light.floor_lamp_new
  - light.shelly_luz_outdoor
  - light.shelly_luz_salon

# ============================================================
# Thread border-router Wi-Fi leg
# ============================================================
# The Eve door sensors are Matter-over-Thread. This Pi has no 802.15.4 radio, so
# it reaches them only through a Thread Border Router — the HomePod "Bano", which
# announces the route to the mesh in a Router Advertisement. RAs are link-local
# and do not cross VLANs.
#
# On 2026-08-17 11:33 CEST the HomePod was moved off the IoT SSID (VLAN 100) onto
# the NO_VPN SSID (VLAN 20) to fix AirPlay. eth0 is on VLAN 100, so this
# host lost the route; both door sensors went unavailable 3.5 minutes later and
# stayed that way for five days. matter-server had given up and only re-checked
# twice a day, so nothing recovered on its own.
#
# The HomePod is staying on VLAN 20. This gives dockassist a second, IPv6-only
# foot on that VLAN so it is on-link with the BR again. eth0/VLAN 100 is
# untouched — see the template for why ipv4.method=disabled is load-bearing.
enable_thread_wifi_link: true
thread_wifi_link_ssid: "{{ vault_thread_wifi_link_ssid }}"

# ============================================================
# Presence health — the source Tado consumes, not Tado itself
# ============================================================
# Renamed from the Tado check on 2026-08-26 because the old name described the
# consumer rather than the thing being checked. There is ONE presence source:
# Companion App -> device_tracker -> person -> group.persons -> Tado API.
# Nothing lists the phones. The check walks every `person` entity's
# `device_trackers` attribute, so a replaced or added phone is covered the
# moment it is attached to a person in HA's UI — no repo change, and no silent
# gap while nobody remembers to edit a list. Same lesson as the entity check's
# stateless-domain rule: a hardcoded roster stops covering what comes next.
#
# The only thing worth naming is what to SKIP.
presence_ignore_persons:
  # A placeholder person for the agent tier — no human, no phone, permanently
  # `unknown`. Without this it would page on every run.
  - person.ai_agent

# Hours of silence before a tracker still reading `home` is called frozen.
#
# Derived from measurement, not taste (7 days of HA history, 2026-08-26): the
# widest healthy reporting gaps were 470 min and 721 min. 18 h is ~2.3x the
# larger. ⚠️ Do not tighten this without re-measuring — a value under ~12 h
# pages on ordinary overnight quiet, and only `home` can trigger it anyway, so
# tightening buys very little.
presence_stale_hours: 18

# ============================================================
# Entity health — the check the five-day outage did not have
# ============================================================
# Every check on this fleet watches the machinery: host up, container running,
# service active, cron fresh. All of it was green for the five days above,
# because a matter-server with zero live subscriptions is byte-for-byte as
# chatty as a healthy one. Nothing watched whether the DEVICES still answered.
# This does — it asks HA what entities exist and judges all of them.
#
# See docs/TODO.md item 15.
#
# 🔴 Ships DISABLED on purpose, and the toggle is the last step of the rollout,
# not the first. With an empty allowlist the first cron run pages #home-alerts
# with every entity that was already unavailable — the five stale Tado
# automations of item 12, and whatever else the fleet has quietly accumulated.
# That alert is unactionable at 07:00, it lands in the watched channel, and
# agent-lxc's Tier 2 would spend real money investigating it. Seed the
# allowlist from a `--report` run first; the deploy plan in TODO item 15 flips
# this to true as step 4.
enable_ha_entity_health_check: true

# How long an entity may sit unavailable/unknown before it pages.
#
# 900s is chosen against Home Assistant restarts, not against the fault: a
# restart flips every entity through `unavailable` at once, and a check that
# pages on every deploy gets muted — which would reproduce the exact silence
# this check exists to break. The door sensors were gone for five days, so
# fifteen minutes of deliberate patience costs nothing against the failure
# actually being defended against.
ha_entity_health_grace_seconds: 900

# Deliberately NOT under logs_dir: that is `.logs` (cron output) while the
# monitoring wrapper's state lives in `.log`, one character apart, and
# logs_dir never reaches cron's environment anyway. Named in full so neither
# ambiguity can apply.
ha_entity_health_state_file: "/home/{{ ansible_user }}/.log/ha_entity_health.state.json"

# Entities that are known to be unavailable and accepted as such. fnmatch
# patterns. Explicit and versioned on purpose — there is no auto-baseline,
# because silently accepting whatever happened to be broken on deploy day is
# how a check ships that can never fire.
#
# Seeded 2026-08-25 from a real `--report` run on dockassist (296 entities, 90
# in unavailable/unknown), NOT from guesswork. Every pattern below was matched
# against an entity that actually exists.
ha_entity_health_allowlist:
  # The phone's Companion App sensors. These go unavailable whenever a
  # full-tunnel VPN is up or the app is asleep — a known, accepted edge case,
  # not a fault. ⚠️ The cost is real and deliberate: this check can no longer
  # tell you the Companion integration has BROKEN, because broken and
  # "he's on the VPN" look identical from here. Presence itself is still
  # covered by check_tado_health.sh, which watches the trackers by name.
  # ⚠️ Cover BOTH domains for BOTH phones. The first seeding had
  # sensor.+binary_sensor. for nexuschoky but only sensor. for iphone_de_candela,
  # purely because no binary_sensor of Candela's phone happened to be offline
  # during the sample. binary_sensor.iphone_de_candela_camera_motion then paged
  # for 45 consecutive runs on 2026-08-26. Same root cause as the TV below —
  # a snapshot cannot show you what is asleep at a different hour — but this one
  # was also catchable by symmetry: if a pattern is right for one phone it is
  # right for the other.
  # Matched by DEVICE, not by domain. Listing sensor.+binary_sensor. per phone
  # meant a third domain appearing later would page — and the Companion App
  # creates entities across sensor, binary_sensor, device_tracker and notify.
  # Two reactive patches in two days (2026-08-25 sensor., 2026-08-26
  # binary_sensor.) were one pattern each; this is the whole device, once.
  #
  # ⚠️ Presence is deliberately NOT relying on this check — device_tracker for
  # both phones is watched by name in check_presence_health.sh, which is why muting
  # the whole device here does not create a presence blind spot.
  # The Companion App creates entities in exactly four domains. All four were
  # enumerated on 2026-08-26 and each got a deliberate decision, so this is not
  # the domain-at-a-time patching it resembles:
  #
  #   sensor / binary_sensor  -> SUPPRESS. 26 of 56 were dark at 21:40 on a
  #                              normal evening. Battery, storage, steps, SSID,
  #                              geocoded location — telemetry, no function.
  #   device_tracker          -> WATCH. Measured: these held `home`/`not_home`
  #                              while half their siblings went unavailable, so
  #                              they cost nothing in noise and a tracker that
  #                              DOES go unavailable is a real fault.
  #   notify                  -> WATCH. If these go unavailable, HA's push
  #                              notifications stop silently. Stateless, so the
  #                              domain rule already excuses their permanent
  #                              `unknown`; only `unavailable` can page.
  #
  # ⚠️ Do not collapse these back to `*nexuschoky*` — that was tried and it
  # swallowed both trackers and both notify services.
  - "sensor.nexuschoky_*"
  - "binary_sensor.nexuschoky_*"
  - "sensor.iphone_de_candela_*"
  - "binary_sensor.iphone_de_candela_*"
  # Shairport now-playing metadata, fed over MQTT: `unknown` is its resting
  # state when nothing is streaming. Verified 2026-08-25 rather than assumed —
  # hifipi's shairport-sync 5.1 build does include `mqtt`, so these are idle,
  # not a dead integration.
  - "sensor.shairport_sync_hifipi_*"
  - "binary_sensor.shairport_sync_hifipi_*"
  # HA's built-in backup integration, never configured — our backups are
  # do_backup + heartbeat_backup.sh, not this.
  - "sensor.backup_*"
  # A placeholder person with no device tracker, by construction.
  - "person.ai_agent"
  # 🔴 HOLDING ENTRIES, NOT A VERDICT. Eleven stale automations left in HA's
  # .storage — TODO item 12 says delete them in the UI (it estimated five; the
  # real count is eleven). Listed by exact name, never as `automation.*`, so a
  # genuine automation failure still pages. Once deleted they disappear from
  # /api/states and these entries go inert; remove them then.
  - "automation.scheduled_mon_tue_tado_home"
  - "automation.tado_away_schedule"
  - "automation.tado_health_check"
  - "automation.tado_integration_down_alert"
  - "automation.tado_integration_recovery_alert"
  - "automation.wyze_bulb_offline_alert"
  - "automation.wyze_bulb_online_recovery"
  - "automation.spotify_play"
  - "automation.spotify_stop"
  - "automation.sun_elevation_lights_on_simple"
  - "automation.sunset_lights_on_sunset"
  # CONDITIONALLY AVAILABLE, which is a third category — neither stateless nor
  # dead. A Shelly Plus Smoke exposes its mute button only while the alarm is
  # actually sounding; with no alarm there is nothing to mute, so HA renders it
  # `unavailable`. Found by this check's first real run, 2026-08-25.
  #
  # ⚠️ Safe ONLY because it is this one entity by name. The detector's real
  # health rides on its siblings — binary_sensor...smoke (off), sensor...battery
  # (96%) — and neither is allowlisted, so a genuinely offline smoke alarm still
  # pages. Never widen this to shellyplussmoke_*.
  - "button.shellyplussmoke_3076f523fd68_mute_alarm"
  # 🔴 DIURNAL DEVICES — the hole the first seeding missed, and the reason this
  # list cannot be built from one sample. The allowlist was seeded 2026-08-25
  # from a single `--report` run taken while the TV happened to be ON. It went
  # off at 23:40 that night and the check then failed 54 consecutive runs
  # before anyone looked. A device a human switches off is `unavailable` for
  # exactly the reason it should be, every night, forever.
  #
  # 📌 Rule for anything added here later: a point-in-time baseline only sees
  # what is asleep *right now*. Before trusting a fresh `--report`, ask which
  # devices are off at this hour and would not appear.
  - "media_player.cobi_tv*"
  - "remote.cobi_tv*"
  # A smart bulb on a SWITCHED circuit. Verified physically 2026-08-28: the lamp
  # was simply switched off, and a Shelly Duo loses power with the circuit, so
  # it reports `unavailable` rather than `off`.
  #
  # 📌 The discriminator for which bulbs need this: its three identical siblings
  # read `off` — powered, reachable, unlit — because their circuits stay live.
  # Only this one is on a switch someone actually uses. Do not blanket-mute the
  # other Shelly Duos; they would correctly report a real failure.
  #
  # ⚠️ Cost, stated rather than buried: a genuine failure of THIS bulb is now
  # invisible. Accepted because it is *indistinguishable* from switched-off —
  # both are `unavailable`, and nothing this check can see separates them. The
  # fix that would recover the coverage is per-pattern grace windows (a lamp off
  # overnight is ~12 h; a dead bulb is forever), filed as TODO item 21.
  - "light.book_floor_lamp"
  - "*shellyduobulbg3_d885ac037d10*"
  # Same class, same holding status.
  - "schedule.mon_thu_away_schedule"
  - "binary_sensor.wyze_online"
  - "media_player.bathroom_2"
  - "remote.bathroom_2"

# Domains with no state until something invokes them — see the script's own
# note. `unknown` here is normal; `unavailable` still pages.
ha_entity_health_stateless_domains:
  - button
  - notify
  - conversation
  - infrared
  - scene
  - script
  - tts
  - stt
