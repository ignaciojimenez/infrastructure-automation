---
# Unified Multi-Platform Inventory
# Hosts inherit smart defaults:
#   - ansible_host: inventory_hostname (key name)
#   - ansible_user: current user
#   - platform_type: from parent group
# Only override when different!

all:
  children:
    # ========== DEBIAN-BASED SYSTEMS ==========
    debian_hosts:
      vars:
        os_family: debian
        package_manager: apt
        service_manager: systemd
        ansible_python_interpreter: /usr/bin/python3
        infrastructure_group: "{{ infrastructure_user }}"  # Debian uses user's group

      children:
        # Raspberry Pi hosts
        raspberrypi:
          vars:
            platform_type: raspberrypi
          hosts:
            cobra:
              primary_function: media
              # Samsung T7 media drive (Plex library) — NVMe behind an ASMedia
              # USB bridge, so it needs -d sntasmedia (plain/-d sat don't pass SMART).
              enable_smart_monitoring: true
              smart_devices: ["sntasmedia:/dev/sda"]
            hifipi:
              primary_function: audio_playback
            vinylstreamer:
              primary_function: audio_streaming
            dockassist:
              primary_function: homeassistant

        # LXC containers
        lxc_containers:
          vars:
            platform_type: lxc
          hosts:
            unifi-lxc:
              ansible_host: unifi  # Different from key
              container_id: 101
              primary_function: network_controller
            agent-lxc:
              ansible_host: 10.30.40.203  # Static; see group_vars/agent.yml
              container_id: 103
              primary_function: agent
              # Must live here, not in group_vars/agent.yml: bootstrap.yml owns
              # the ufw install/allow-22/enable sequence and runs long before
              # services.yml include_vars loads the function file.
              enable_ufw: true

        # Proxmox host
        proxmox_hosts:
          vars:
            platform_type: proxmox
          hosts:
            cwwk:
              primary_function: hypervisor
              enable_usb_recovery: true
              usb_recovery_uuid: "c818d08a-56e9-4515-8e7f-9eb3c2994900"
              zfs_arc_max_gb: 10
              # rpool NVMe — the single storage layer under every VM/CT.
              enable_smart_monitoring: true
              smart_devices: ["nvme:/dev/nvme0n1"]

    # ========== ARCHIVED HOSTS ==========
    # Uncomment to re-enable. Role: services/pihole, vars: group_vars/dns.yml
    # archived_hosts:
    #   children:
    #     archived_lxc:
    #       vars:
    #         platform_type: lxc
    #       hosts:
    #         pihole-lxc:
    #           ansible_host: pihole
    #           container_id: 102
    #           primary_function: dns
    #           archived_reason: "Moved DNS to Unbound on OPNsense (Nov 2025)"

    # ========== FREEBSD-BASED SYSTEMS ==========
    freebsd_hosts:
      vars:
        os_family: freebsd
        package_manager: pkg
        service_manager: rc
        ansible_python_interpreter: /usr/local/bin/python3
        platform_type: opnsense
        infrastructure_group: wheel  # FreeBSD uses wheel group
      hosts:
        opnsense:
          vm_id: 100  # Runs as VM on Proxmox
          scripts_dir: /usr/local/bin
          primary_function: firewall
          # OPNsense's ssh rc script is `openssh`, not stock FreeBSD's `sshd` —
          # the same name ssh_hardening already uses for `service openssh
          # onereload`. Confirmed on the box 2026-08-06: `service openssh
          # status` runs, `service sshd status` does not, and only
          # /usr/local/etc/rc.d/openssh exists. Set here rather than in the
          # script so a stock-FreeBSD host keeps working.
          # Host level, not group: group_vars/all wins over inventory-file
          # group vars (docs/TODO.md).
          critical_services: ["openssh", "cron"]
