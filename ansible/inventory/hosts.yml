---
# Unified Multi-Platform Inventory
# Hosts inherit smart defaults:
#   - ansible_host: inventory_hostname (key name)
#   - ansible_user: current user
#   - platform_type: from parent group
# Only override when different!

all:
  children:
    # ========== DEBIAN-BASED SYSTEMS ==========
    debian_hosts:
      vars:
        os_family: debian
        package_manager: apt
        service_manager: systemd
        ansible_python_interpreter: /usr/bin/python3
        infrastructure_group: "{{ infrastructure_user }}"  # Debian uses user's group

      children:
        # Raspberry Pi hosts
        raspberrypi:
          vars:
            platform_type: raspberrypi
          hosts:
            # ============================================================
            # critical_services — added 2026-08-13 after cobra's nmbd sat dead
            # for four days.
            #
            # Every host below previously had NO list, so check_services fell
            # back to its built-in `ssh cron fail2ban` and nothing else on this
            # fleet was named. What a host actually exists to do — serve media,
            # play audio, run the controller — was covered only by the generic
            # `systemctl --failed` sweep. That distinction is not academic:
            # `--failed` sees a unit that CRASHED, and is blind to one that was
            # stopped, disabled or masked cleanly. nmbd happened to fail, so it
            # was caught; a service someone stops by hand is not.
            #
            # ⚠️ Every name here was verified `active` on the host itself
            # (2026-08-13) before being listed. Naming a service that is not
            # actually running turns this into a permanent false alert, which
            # is worse than the gap it closes — samba-ad-dc on cobra and mongod
            # on unifi-lxc are both enabled-but-inactive and are deliberately
            # NOT listed for exactly that reason.
            #
            # The list REPLACES the built-in default rather than extending it,
            # so ssh/cron/fail2ban must be repeated on every host.
            # ============================================================
            cobra:
              primary_function: media
              critical_services:
                - ssh
                - cron
                - fail2ban
                - smbd
                # The four-day outage. Browsing by name breaks without it while
                # smbd stays up, so the share looks healthy from every angle
                # except the one that matters.
                - nmbd
                - plexmediaserver
                - transmission-daemon
                # Fleet name resolution is mDNS only — Unbound holds no fleet
                # records (docs/NETWORK.md). avahi stopping does not just
                # inconvenience this host; it removes it from the network's
                # namespace, which is how a live host starts looking dead.
                - avahi-daemon
              # Samsung T7 media drive (Plex library) — NVMe behind an ASMedia
              # USB bridge, so it needs -d sntasmedia (plain/-d sat don't pass SMART).
              enable_smart_monitoring: true
              smart_devices: ["sntasmedia:/dev/sda"]
              # Plex publishes no Debian-Security label, so the template's
              # security-only patterns can never match it. Note this repo is a
              # single rolling suite (a=public), so unlike the pinned vendor
              # repos on unifi-lxc it can deliver major versions.
              custom_origins:
                - "origin=Plex Media Server Repository"
            hifipi:
              primary_function: audio_playback
              critical_services:
                - ssh
                - cron
                - fail2ban
                - mpd
                - shairport-sync
                - raspotify
                - avahi-daemon
            vinylstreamer:
              primary_function: audio_streaming
              critical_services:
                - ssh
                - cron
                - fail2ban
                # Not in `systemctl list-unit-files --state=enabled`, yet
                # measured `active` on the host. Listing only what that command
                # reports would have silently dropped the one service this host
                # is named after.
                - icecast2
                - phono_liquidsoap
                - detect_audio
                - avahi-daemon
            dockassist:
              primary_function: homeassistant
              critical_services:
                - ssh
                - cron
                - fail2ban
                # The containers themselves are covered by check_container.sh /
                # check_docker.sh. These two are the floor under those checks —
                # if the daemon is gone, every container check is reporting on
                # something that cannot possibly be running.
                - docker
                - containerd
                - avahi-daemon

        # LXC containers
        lxc_containers:
          vars:
            platform_type: lxc
          hosts:
            unifi-lxc:
              ansible_host: unifi  # Different from key
              container_id: 101
              primary_function: network_controller
              # None of these publish a Debian-Security label, so the template's
              # security-only patterns can never match them and the controller
              # stack would go unpatched. All three pin a major version in
              # sources.list (unifi-9.4, mongodb-org/8.0, temurin-N packages),
              # so they can only deliver patches within the pinned line.
              #
              # Ubiquiti is matched by `site=`, NOT `origin=`, and that is not a
              # style choice: its apt Origin is literally "Ubiquiti Networks,
              # Inc." and unattended-upgrades splits each pattern on commas to
              # separate key=value pairs — so `origin=Ubiquiti Networks, Inc.`
              # raises ValueError in match_whitelist_string() rather than
              # matching. Verified against the real matcher on the host.
              custom_origins:
                - "site=www.ui.com"
                - "origin=mongodb"
                - "origin=Artifactory"
              # 🔴 This host had the widest gap in the fleet: system_health_check.sh
              # is its ONLY monitoring cron — no check_unifi.sh is deployed here —
              # so before this list, nothing named the controller at all.
              #
              # mongod is deliberately absent: it reads `inactive` because
              # UniFi 9.x runs its own bundled instance rather than the packaged
              # unit. Listing it would page forever about a service that is not
              # supposed to be up.
              critical_services:
                - ssh
                - cron
                - fail2ban
                - unifi
                - nftables
            agent-lxc:
              ansible_host: 10.30.40.203  # Static; see group_vars/agent.yml
              container_id: 103
              primary_function: agent
              # Must live here, not in group_vars/agent.yml: bootstrap.yml owns
              # the ufw install/allow-22/enable sequence and runs long before
              # services.yml include_vars loads the function file.
              enable_ufw: true
              # ufw is listed because of what this container holds: an SSH key
              # trusted by all seven hosts. Its firewall silently stopping is a
              # security fault, not a service inconvenience, and nothing else
              # would report it.
              critical_services:
                - ssh
                - cron
                - fail2ban
                - ufw

        # Proxmox host
        proxmox_hosts:
          vars:
            platform_type: proxmox
          hosts:
            cwwk:
              primary_function: hypervisor
              # Security patches still install automatically; only the reboot
              # that applies a kernel or libc one is left to a human.
              #
              # This is the hypervisor. An unattended 04:00 restart takes the
              # OPNsense VM — and with it the house's internet — plus every
              # container, on a box that has overheated twice. Proxmox has no
              # standard to follow here either: unattended-upgrades is not
              # installed by default on PVE, and the official Package
              # Repositories documentation describes only *notification*
              # ("Proxmox VE automatically checks for package updates on a
              # daily basis. The root@pam user is notified via email"), leaving
              # the apply to a person. This matches that model.
              #
              # ⚠️ Only safe because `check_pending_reboot` in
              # system_health_check.sh reports the flag and fails after 7 days.
              # Without it this trades an unannounced reboot for an unnoticed
              # unpatched kernel. Deploy that first — it ships via
              # deploy_monitoring.yml, this ships via platform/debian.yml.
              auto_reboot: false
              enable_usb_recovery: true
              usb_recovery_uuid: "c818d08a-56e9-4515-8e7f-9eb3c2994900"
              zfs_arc_max_gb: 10
              # The hypervisor under the OPNsense VM: pve-cluster losing quorum
              # or pvestatd dying takes guest management with it, and the
              # existing checks here (backup + USB sync + system health) name
              # none of the PVE stack. pvedaemon/pveproxy are the API and web
              # paths a recovery would go through, so their absence is exactly
              # the thing you need told BEFORE you need them.
              critical_services:
                - ssh
                - cron
                - fail2ban
                - pve-cluster
                - pvedaemon
                - pveproxy
                - pvestatd
                - pve-firewall
              # rpool NVMe — the single storage layer under every VM/CT.
              enable_smart_monitoring: true
              smart_devices: ["nvme:/dev/nvme0n1"]

    # ========== ARCHIVED HOSTS ==========
    # Uncomment to re-enable. Role: services/pihole, vars: group_vars/dns.yml
    # archived_hosts:
    #   children:
    #     archived_lxc:
    #       vars:
    #         platform_type: lxc
    #       hosts:
    #         pihole-lxc:
    #           ansible_host: pihole
    #           container_id: 102
    #           primary_function: dns
    #           archived_reason: "Moved DNS to Unbound on OPNsense (Nov 2025)"

    # ========== FREEBSD-BASED SYSTEMS ==========
    freebsd_hosts:
      vars:
        os_family: freebsd
        package_manager: pkg
        service_manager: rc
        ansible_python_interpreter: /usr/local/bin/python3
        platform_type: opnsense
        infrastructure_group: wheel  # FreeBSD uses wheel group
        # Consistent with the fleet: /home/choco/.scripts, like all seven Debian
        # hosts. This was `/usr/local/bin`, which left the firewall half
        # consistent — logs already went to /home/choco/.logs — and had a real
        # cost: deploy_monitoring.yml creates `{{ scripts_dir }}` owned by the
        # infrastructure user, so /usr/local/bin on the internet-facing host was
        # `choco:wheel`, putting a user-writable directory on root's PATH.
        #
        # ⚠️ NOT a durability fix, and it must not be described as one. Measured
        # on the box 2026-08-06: OPNsense reverts what it *generates* from
        # config.xml — accounts, sshd_config — and leaves alone files it never
        # owned. /usr/local/bin still holds our scripts from Nov 2025, three
        # firmware upgrades on, and read_agent's home outlived the deletion of
        # read_agent itself. Both locations are durable; this is for consistency
        # and for the ownership, nothing more.
      hosts:
        opnsense:
          vm_id: 100  # Runs as VM on Proxmox
          # scripts_dir intentionally NOT overridden — see the group default.
          primary_function: firewall
          # No critical_services override: system_health_check.sh is no longer
          # deployed here at all (the OPNsense role has its own check). The
          # script's built-in probe finds /usr/local/etc/rc.d/openssh on its
          # own — confirmed on the box 2026-08-06 — so if it ever returns, it
          # needs no inventory to get the name right.
