---
# Test inventory — the disposable containers on cwwk, and nothing else.
#
#   ansible-playbook -i ansible/inventory/test_hosts.yml \
#       ansible/playbooks/deploy_monitoring.yml
#
# These hosts are created and destroyed by tests/provision_test_container.sh;
# every value here mirrors that script's defaults. Keep the two in step.
# See docs/TEST_CONTAINER.md for what each container is a proxy for, and what
# it is NOT a proxy for.
#
# ⚠️ Do not add a fleet host to this file. Playbooks run from here deploy with
# dead Slack tokens and skip nothing; a real host would go quiet.
#
# ------------------------------------------------------------------
# Why every override below is repeated per host rather than set once on the
# group: group_vars/all/main.yml is inventory group_vars, precedence 4, and
# overrides anything a group defined *inside* an inventory file sets
# (precedence 3). Host vars are precedence 8 and win. Moving any of these up to
# `debian_hosts.vars` silently reverts it to the fleet value — verify with
#   ansible -i ansible/inventory/test_hosts.yml all -m debug -a 'msg={{ scripts_dir }}'
# ------------------------------------------------------------------

all:
  children:
    debian_hosts:
      vars:
        os_family: debian
        package_manager: apt
        service_manager: systemd
        ansible_python_interpreter: /usr/bin/python3
        infrastructure_group: "{{ infrastructure_user }}"

      children:
        lxc_containers:
          vars:
            platform_type: lxc
          hosts:
            # CT 199 — Debian 13. Twin of agent-lxc and unifi-lxc; close to cwwk.
            testlxc:
              ansible_host: 10.30.40.205
              container_id: 199

              # Connection: root over the passphrase-free read_agent key — the
              # only credential these containers have. IdentityAgent=none keeps
              # Secretive and its Touch ID prompt out of the path, so the runs
              # are unattended.
              ansible_user: root
              ansible_ssh_private_key_file: ~/.ssh/read_agent_ed25519
              ansible_ssh_common_args: >-
                -o ConnectTimeout=5
                -o IdentitiesOnly=yes
                -o IdentityAgent=none
                -o StrictHostKeyChecking=accept-new

              # group_vars/all derives primary_user — and through it
              # scripts_dir, logs_dir and home_dir — from ansible_user, which on
              # a fleet host is the infrastructure user. Here it is root, so
              # without this the playbooks would deploy to /home/root/.scripts
              # and the rig would exercise paths production does not have.
              # provision_test_container.sh creates this user on the container.
              primary_user: "{{ infrastructure_user }}"

              # Deliberately unmatched: no roles/services/test/ and no
              # group_vars/test.yml exist, so services.yml deploys the
              # monitoring play and nothing else. Point it at a real function to
              # exercise that role. It has to be set to *something* —
              # services.yml:46 evaluates `primary_function == "media"` with no
              # `is defined` guard and errors out on a host that omits it.
              primary_function: test

              # Dead webhook paths. The monitoring cron tasks are gated on these
              # being defined, so the rig still exercises them, but nothing it
              # deploys can post into #home-logging or #home-alerts. A container
              # heartbeating into the fleet's channels is indistinguishable from
              # a fleet host doing it, and these tests deliberately break things.
              logging_token: "TEST/TEST/testcontainernotarealwebhook"
              alert_token: "TEST/TEST/testcontainernotarealwebhook"

              # Skips hardware-dependent tasks (Pi thermals, ALSA, USB).
              is_test_environment: true

            # CT 198 — Debian 12. Proxy for the four Raspberry Pis on the axis
            # that matters to a POSIX shell script: OS release, not CPU.
            test-deb12:
              ansible_host: 10.30.40.206
              container_id: 198

              ansible_user: root
              ansible_ssh_private_key_file: ~/.ssh/read_agent_ed25519
              ansible_ssh_common_args: >-
                -o ConnectTimeout=5
                -o IdentitiesOnly=yes
                -o IdentityAgent=none
                -o StrictHostKeyChecking=accept-new

              primary_user: "{{ infrastructure_user }}"
              primary_function: test
              logging_token: "TEST/TEST/testcontainernotarealwebhook"
              alert_token: "TEST/TEST/testcontainernotarealwebhook"
              is_test_environment: true
