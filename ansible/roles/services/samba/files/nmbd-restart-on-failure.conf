# Managed by Ansible (roles/services/samba) — do not edit on the host.
#
# nmbd loses a race on cold power-on. Measured on cobra, 2026-08-09 21:40:28:
# systemd started it, it never reached `ready`, and 90 s later systemd killed
# it — "start operation timed out ... Failed with result 'timeout'". It then
# sat dead for four days. The unit's ordering is already correct
# (Wants=/After=network-online.target); network-online.target simply completed
# before an IPv4 address existed. It succeeded on 5 of 6 boots, so this is an
# intermittent race, and cold power-ons are a recurring event here.
#
# Restart=on-failure covers a start timeout as well as a non-zero exit —
# systemd.service(5) on this host: restarted "when an operation ... times
# out" — which is what was actually observed, rather than the clean non-zero
# exit that "on-failure" is usually reached for. It does not cover
# ExecCondition declining with 1-254 (/usr/share/samba/is-configured nmb),
# which leaves the unit not-failed, so a host with Samba installed but
# unconfigured still will not loop.
#
# The retry envelope is deliberate and finite. One cycle is 90 s of start
# timeout plus 30 s of RestartSec, so four attempts span roughly eight
# minutes; after that the unit stays failed. That matters more than the
# restart does: nmbd is in cobra's critical_services, so a fault that is not
# a boot race still has to end up in front of a person rather than being
# retried into silence.
#
# StartLimitIntervalSec is set here rather than inherited. The stock 10 s
# window cannot contain retries that are 120 s apart, so the default burst
# limit would never engage and "gives up eventually" would be an accident.

[Unit]
StartLimitIntervalSec=900
StartLimitBurst=4

[Service]
Restart=on-failure
RestartSec=30
