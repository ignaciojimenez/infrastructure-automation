---
# Home Assistant handlers

- name: Restart Home Assistant
  community.docker.docker_container:
    name: "{{ homeassistant_container_name | default('home-assistant') }}"
    state: started
    restart: true
  become_user: "{{ ansible_user }}"

- name: Restart mosquitto
  community.docker.docker_container:
    name: "{{ mosquitto_container_name | default('mosquitto') }}"
    state: started
    restart: true
  become_user: "{{ ansible_user }}"
  listen: restart mosquitto

- name: Reload NetworkManager connections
  become: true
  ansible.builtin.command:
    cmd: nmcli connection reload
  changed_when: true
  listen: Reload NetworkManager connections
