---
# Home Assistant service role

# Docker installation is handled by the docker role
# Include docker role as a dependency in meta/main.yml

- name: Install Home Assistant dependencies
  become: true
  ansible.builtin.apt:
    name:
      - apparmor-utils
      - avahi-daemon
      - dbus
      - jq
      - network-manager
      - socat
      - python3-docker
    state: present
    update_cache: true
  tags: [homeassistant, packages]

- name: Check if ModemManager is installed
  ansible.builtin.systemd:
    name: ModemManager
  register: modemmanager_check
  failed_when: false
  changed_when: false
  tags: [homeassistant]

- name: Disable ModemManager (conflicts with Home Assistant USB devices)
  become: true
  ansible.builtin.systemd:
    name: ModemManager
    enabled: false
    state: stopped
  when:
    - modemmanager_check.status is defined
    - not (is_test_environment | default(false))
  tags: [homeassistant]
  # Note: ModemManager interferes with USB devices (Zigbee, Z-Wave, etc.)
  # Only disabled if service exists and not in test environment

- name: Create Home Assistant directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ homeassistant_config_dir | default('/home/' + ansible_user + '/homeassistant') }}"
    - "{{ homeassistant_config_dir | default('/home/' + ansible_user + '/homeassistant') }}/backups"
  tags: [homeassistant, directories]

- name: Deploy Home Assistant core configuration
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ homeassistant_config_dir | default('/home/' + ansible_user + '/homeassistant') }}/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  loop:
    - configuration.yaml
    - automations.yaml
    - groups.yaml
    - scenes.yaml
  notify: Restart Home Assistant
  tags: [homeassistant, config]

# Disaster-recovery seed for the RM4 Mini's learned IR codes (rca_switcher
# input positions for the amp). HA owns this file — learning a new command
# rewrites it — so seed only when missing (fresh rebuild), never overwrite.
# Re-capture into files/ after learning new codes to keep the seed current.
- name: Seed Broadlink learned IR codes (only if missing)
  ansible.builtin.copy:
    src: broadlink_remote_1cd1d72734d3_codes
    dest: "{{ homeassistant_config_dir | default('/home/' + ansible_user + '/homeassistant') }}/.storage/broadlink_remote_1cd1d72734d3_codes"
    owner: root
    group: root
    mode: '0600'
    force: false
  become: true
  tags: [homeassistant, config]

- name: Deploy Home Assistant secrets
  ansible.builtin.template:
    src: secrets.yaml.j2
    dest: "{{ homeassistant_config_dir | default('/home/' + ansible_user + '/homeassistant') }}/secrets.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'
  notify: Restart Home Assistant
  tags: [homeassistant, secrets]

- name: Create scripts directory
  ansible.builtin.file:
    path: "{{ homeassistant_config_dir | default('/home/' + ansible_user + '/homeassistant') }}/scripts"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  tags: [homeassistant, scripts]

- name: Deploy train notification script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/services/homeassistant/notify_train_platform.sh"
    dest: "{{ homeassistant_config_dir | default('/home/' + ansible_user + '/homeassistant') }}/scripts/notify_train_platform.sh"
    owner: root
    group: root
    mode: '0755'
  become: true
  tags: [homeassistant, scripts]

- name: Deploy Tado presence script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/services/homeassistant/tado_presence.sh"
    dest: "{{ homeassistant_config_dir | default('/home/' + ansible_user + '/homeassistant') }}/scripts/tado_presence.sh"
    owner: root
    group: root
    mode: '0755'
  become: true
  tags: [homeassistant, scripts]

# No `force_source: true` on any of the three image pulls in this role —
# decided 2026-08-16. These tags are rolling (`:stable`, `:latest`), so
# force_source made every deploy a potential version change: a run to fix a
# cron or push an MQTT setting could move Home Assistant, with no decision
# taken and nothing recorded but a `changed`. Upgrades belong to the
# `update_ha` script and its cron, which this role already ships, announces to
# Slack, and can roll back. Ansible's job here is to have *an* image and a
# correctly configured container, not to chase upstream.
#
# Consequence to expect: the pull no longer refreshes a rolling tag, so an
# image only moves when update_ha moves it.
- name: Pull Home Assistant Docker image
  community.docker.docker_image:
    name: "ghcr.io/home-assistant/home-assistant:{{ homeassistant_version | default('stable') }}"
    source: pull
  become_user: "{{ ansible_user }}"
  tags: [homeassistant, docker]

- name: Create and start Home Assistant container
  community.docker.docker_container:
    name: "{{ homeassistant_container_name | default('home-assistant') }}"
    image: "ghcr.io/home-assistant/home-assistant:{{ homeassistant_version | default('stable') }}"
    restart_policy: unless-stopped
    privileged: true
    # `:rw` here changes nothing on its own — community.docker's
    # _preprocess_volumes appends the mode before any comparison, so this task
    # expected `…:/config:rw` even when it said `…:/config`. It is spelled out
    # so both writers of this container agree on the page: templates/update_ha.j2
    # recreates it with `docker run`, which stores HostConfig.Binds verbatim,
    # and that is the end where the mismatch was actually created.
    volumes:
      - "{{ homeassistant_config_dir | default('/home/' + ansible_user + '/homeassistant') }}:/config:rw"
      - "/etc/localtime:/etc/localtime:ro"
    network_mode: host
    env:
      TZ: "{{ timezone | default('Europe/Madrid') }}"
    state: started
  become_user: "{{ ansible_user }}"
  tags: [homeassistant, docker]

# ============================================================
# Cloudflare Tunnel Configuration
# ============================================================

- name: Pull Cloudflared Docker image
  community.docker.docker_image:
    name: cloudflare/cloudflared:latest
    source: pull
  become: true
  become_user: "{{ ansible_user }}"
  when: enable_cloudflare_tunnel | default(true)
  tags: [homeassistant, cloudflare, docker]

- name: Create and start Cloudflared tunnel container
  community.docker.docker_container:
    name: cloudflared
    image: cloudflare/cloudflared:latest
    restart_policy: unless-stopped
    network_mode: host
    command: "tunnel --no-autoupdate run --token {{ vault_cloudflare_tunnel_token }}"
    state: started
  become: true
  become_user: "{{ ansible_user }}"
  when: enable_cloudflare_tunnel | default(true)
  tags: [homeassistant, cloudflare, docker]

# HACS removed 2026-08-28. It was installed, loaded on every boot, refreshed a
# 2.6 MB repository catalogue — and had installed exactly nothing:
# custom_components/ contained only hacs itself.
#
# 🔴 What it cost to keep: three tasks ran on EVERY deploy, unconditionally —
#     curl -fsSL https://get.hacs.xyz -o /config/install_hacs.sh
#     /bin/bash /config/install_hacs.sh
# That is unpinned remote code execution as root inside the container holding
# secrets.yaml, the HA monitor token and the Cloudflare tunnel token. No
# checksum, no version pin, re-rolled on every run rather than once at install.
#
# 📌 It is also why this host could never reach changed=0: those three were the
# permanent `changed=3` on a second run, so dockassist could not demonstrate
# idempotency and a genuine unexpected change hid among three expected ones.
# A `wait_for` port 8123 with a 30 s delay went with them — it existed only to
# gate the installer.
#
# Gating the installer was considered and rejected: gating means the remote code
# runs once, removal means it never runs again, and nothing here used HACS.
# Reinstalling it deliberately later is cheaper than carrying the path.
#
# The tasks below clear what the integration left behind. They can be deleted
# once dockassist has converged — they are a retirement, not permanent config.
- name: Remove the HACS custom component and its stored state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - "{{ homeassistant_config_dir | default('/home/' + ansible_user + '/homeassistant') }}/custom_components/hacs"
    - "{{ homeassistant_config_dir | default('/home/' + ansible_user + '/homeassistant') }}/.storage/hacs.data"
    - "{{ homeassistant_config_dir | default('/home/' + ansible_user + '/homeassistant') }}/.storage/hacs.hacs"
    - "{{ homeassistant_config_dir | default('/home/' + ansible_user + '/homeassistant') }}/.storage/hacs.repositories"
    - "{{ homeassistant_config_dir | default('/home/' + ansible_user + '/homeassistant') }}/.storage/hacs.critical"
  notify: Restart Home Assistant
  tags: [homeassistant, hacs]

# Deploy management scripts
- name: Deploy Home Assistant management scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ scripts_dir }}/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - update_ha
    - backup_ha
    - stop_run_ha
  tags: [homeassistant, scripts]

# ============================================================
# Monitoring Configuration
# ============================================================

- name: Deploy Home Assistant service check scripts
  ansible.builtin.copy:
    src: "{{ inventory_dir }}/../../scripts/services/homeassistant/{{ item }}"
    dest: "{{ scripts_dir }}/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - check_docker.sh
    - check_ha_web.sh
    - check_container.sh
    - docker_prune.sh
    - check_nic_stalls.sh
  tags: [homeassistant, monitoring]

- name: Deploy Home Assistant templated monitor scripts
  ansible.builtin.template:
    src: "{{ inventory_dir }}/../../scripts/services/homeassistant/{{ item }}.j2"
    dest: "{{ scripts_dir }}/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - dockassist_monitor.sh
    - check_ha_entities.sh
    - check_presence_health.sh
  tags: [homeassistant, monitoring]

# check_nic_stalls.sh keeps a delta baseline here. The directory is otherwise
# created only by the proxmox platform role, so on a Pi it does not exist —
# which left the check permanently in "first run" mode, green and structurally
# unable to alert. Same path and ownership as the proxmox role uses.
- name: Ensure monitoring state directory exists
  ansible.builtin.file:
    path: /var/log/monitoring-state
    state: directory
    owner: "{{ infrastructure_user }}"
    group: "{{ infrastructure_group }}"
    mode: '0755'
  become: true
  tags: [homeassistant, monitoring]

# TODO item 18. Hourly, not every 15 min: this counts a cumulative journal
# figure, so a tighter interval buys no earlier warning, only more runs.
#
# --monitoring-name is MANDATORY here even though the basename is unique today
# — the wrapper keys its state file on the script basename, and two crons
# sharing one basename silently share state. See docs/ARCHITECTURE_DECISIONS.md.
- name: Configure NIC transmit-stall monitoring cron job
  ansible.builtin.cron:
    name: "NIC stall check"
    minute: "23"
    job: >
      {{ scripts_dir }}/enhanced_monitoring_wrapper
      --monitoring-name=nic_stalls
      --heartbeat-interval=daily
      --notify-fixed=true
      {{ logging_token }}
      {{ alert_token }}
      {{ scripts_dir }}/check_nic_stalls.sh
      >> {{ logs_dir }}/nic_stall_check.log 2>&1
    user: "{{ ansible_user }}"
  when:
    - logging_token is defined and logging_token != ''
    - alert_token is defined and alert_token != ''
  tags: [homeassistant, monitoring, cron]

- name: Configure Docker service monitoring cron job
  ansible.builtin.cron:
    name: "Docker service check"
    minute: "0"
    job: >
      {{ scripts_dir }}/enhanced_monitoring_wrapper
      --heartbeat-interval=daily
      --notify-fixed=true
      {{ logging_token }}
      {{ alert_token }}
      {{ scripts_dir }}/check_docker.sh
      >> {{ logs_dir }}/docker_service_check.log 2>&1
    user: "{{ ansible_user }}"
  when:
    - logging_token is defined and logging_token != ''
    - alert_token is defined and alert_token != ''
  tags: [homeassistant, monitoring, cron]

- name: Configure Home Assistant container monitoring cron job
  ansible.builtin.cron:
    name: "Home Assistant container check"
    minute: "*/10"
    job: >
      {{ scripts_dir }}/enhanced_monitoring_wrapper
      --heartbeat-interval=daily
      --notify-fixed=true
      --monitoring-name=homeassistant_container
      {{ logging_token }}
      {{ alert_token }}
      {{ scripts_dir }}/check_container.sh {{ alert_token }} {{ homeassistant_container_name | default('home-assistant') }}
      >> {{ logs_dir }}/homeassistant_container_check.log 2>&1
    user: "{{ ansible_user }}"
  when:
    - logging_token is defined and logging_token != ''
    - alert_token is defined and alert_token != ''
  tags: [homeassistant, monitoring, cron]

- name: Configure Home Assistant web interface monitoring cron job
  ansible.builtin.cron:
    name: "Home Assistant web interface check"
    minute: "0"
    job: >
      {{ scripts_dir }}/enhanced_monitoring_wrapper
      --heartbeat-interval=daily
      --notify-fixed=true
      {{ logging_token }}
      {{ alert_token }}
      {{ scripts_dir }}/check_ha_web.sh
      >> {{ logs_dir }}/homeassistant_web_interface.log 2>&1
    user: "{{ ansible_user }}"
  when:
    - logging_token is defined and logging_token != ''
    - alert_token is defined and alert_token != ''
  tags: [homeassistant, monitoring, cron]

# Retirement of the old name. Ansible's cron module keys on `name`, so simply
# renaming the task would leave the old entry in place — a duplicate cron
# invoking a script this play has just deleted. Both the cron and the file are
# removed explicitly, and this pair must survive until every host has converged.
- name: Retire the old Tado-named presence cron
  ansible.builtin.cron:
    name: "Tado presence health check"
    state: absent
    user: "{{ ansible_user }}"
  tags: [homeassistant, monitoring, cron]

# The script and its now-orphaned wrapper state. The state file matters: left
# behind it keeps reporting whatever last_status it died with, forever, which
# is how ~/.log accumulated a 2025 update_ha_state.json still reading
# "failure". The rotated .log history is deliberately NOT removed.
- name: Remove the old Tado-named presence script and its orphaned state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ scripts_dir }}/check_tado_health.sh"
    - "/home/{{ ansible_user }}/.log/check_tado_health.sh.json"
  tags: [homeassistant, monitoring]

- name: Configure presence health check cron job
  ansible.builtin.cron:
    name: "Presence health check"
    minute: "*/30"
    job: >
      {{ scripts_dir }}/enhanced_monitoring_wrapper
      --heartbeat-interval=daily
      --notify-fixed=true
      --monitoring-name=presence_health
      {{ logging_token }}
      {{ alert_token }}
      {{ scripts_dir }}/check_presence_health.sh
      >> {{ logs_dir }}/presence_health_check.log 2>&1
    user: "{{ ansible_user }}"
  when:
    - logging_token is defined and logging_token != ''
    - alert_token is defined and alert_token != ''
  tags: [homeassistant, monitoring, cron]

# The script above is deployed unconditionally even when the cron below is
# disabled: `check_ha_entities.sh --report` is how the allowlist gets tuned, and
# that has to be runnable by hand before anyone turns the alerting on.
- name: Configure Home Assistant entity health cron job
  ansible.builtin.cron:
    name: "Home Assistant entity health check"
    minute: "*/10"
    job: >
      {{ scripts_dir }}/enhanced_monitoring_wrapper
      --heartbeat-interval=daily
      --notify-fixed=true
      --monitoring-name=homeassistant_entity_health
      {{ logging_token }}
      {{ alert_token }}
      {{ scripts_dir }}/check_ha_entities.sh
      >> {{ logs_dir }}/homeassistant_entity_health.log 2>&1
    user: "{{ ansible_user }}"
  when:
    - enable_ha_entity_health_check | default(false) | bool
    - logging_token is defined and logging_token != ''
    - alert_token is defined and alert_token != ''
  tags: [homeassistant, monitoring, cron]

- name: Ensure monitoring directory exists for heartbeat
  ansible.builtin.file:
    path: "{{ scripts_dir }}/monitoring"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  when: vault_healthcheck_ha is defined
  tags: [homeassistant, monitoring]

- name: Deploy Home Assistant heartbeat script
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../scripts/services/homeassistant/heartbeat_ha.sh"
    dest: "{{ scripts_dir }}/monitoring/heartbeat_ha.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  when: vault_healthcheck_ha is defined
  tags: [homeassistant, monitoring]

- name: Configure Home Assistant healthchecks.io heartbeat
  ansible.builtin.cron:
    name: "Healthchecks.io - Home Assistant health"
    minute: "*/10"
    user: "{{ ansible_user }}"
    job: "{{ scripts_dir }}/monitoring/heartbeat_ha.sh"
    state: present
  when: vault_healthcheck_ha is defined
  tags: [homeassistant, monitoring, cron]

- name: Configure Docker system prune cron job (weekly)
  ansible.builtin.cron:
    name: "Docker system prune"
    special_time: "weekly"
    job: >
      {{ scripts_dir }}/enhanced_monitoring_wrapper
      --heartbeat-interval=always
      --notify-fixed=true
      --monitoring-name=docker_system_prune
      {{ logging_token }}
      {{ alert_token }}
      {{ scripts_dir }}/docker_prune.sh
      >> {{ logs_dir }}/docker_system_prune.log 2>&1
    user: "{{ ansible_user }}"
  when:
    - logging_token is defined and logging_token != ''
    - alert_token is defined and alert_token != ''
  tags: [homeassistant, monitoring, cron]

- name: Configure clean old backups cron job
  ansible.builtin.cron:
    name: "Clean old backups"
    special_time: "weekly"
    job: >
      {{ scripts_dir }}/enhanced_monitoring_wrapper
      --heartbeat-interval=daily
      --notify-fixed=true
      {{ logging_token }}
      {{ alert_token }}
      {{ scripts_dir }}/clean_old_backups.sh
      >> {{ logs_dir }}/clean_old_backups.log 2>&1
    user: "{{ ansible_user }}"
  when:
    - logging_token is defined and logging_token != ''
    - alert_token is defined and alert_token != ''
  tags: [homeassistant, monitoring, cron]

# ============================================================
# Backup Configuration
# ============================================================

- name: Configure Home Assistant backup cron job
  ansible.builtin.cron:
    name: "Home Assistant backup"
    minute: "0"
    hour: "4"
    job: >
      {{ scripts_dir }}/enhanced_monitoring_wrapper
      --heartbeat-interval=daily
      --notify-fixed=true
      {{ logging_token }}
      {{ alert_token }}
      {{ scripts_dir }}/backup_ha create auto
      >> {{ logs_dir }}/homeassistant_backup.log 2>&1
    user: "{{ ansible_user }}"
  when:
    - logging_token is defined and logging_token != ''
    - alert_token is defined and alert_token != ''
  tags: [homeassistant, backup, cron]

- name: Deploy Home Assistant backup freshness heartbeat
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../scripts/common/heartbeat_backup.sh"
    dest: "{{ scripts_dir }}/monitoring/heartbeat_backup_ha.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  vars:
    backup_heartbeat_name: "Home Assistant backup"
    backup_healthcheck_url: "{{ vault_healthcheck_backup_ha }}"
    # State file is written by enhanced_monitoring_wrapper when it runs
    # backup_ha. Heartbeat pings healthchecks.io only if that file is
    # recent (mtime) AND records last_status=success.
    backup_state_file: "/home/{{ ansible_user }}/.log/backup_ha.json"
    backup_max_age_minutes: 1560
  when: vault_healthcheck_backup_ha is defined
  tags: [homeassistant, backup, monitoring]

- name: Configure Home Assistant backup freshness heartbeat cron
  ansible.builtin.cron:
    name: "Healthchecks.io - Home Assistant backup freshness"
    minute: "30"
    hour: "*/2"
    job: "{{ scripts_dir }}/monitoring/heartbeat_backup_ha.sh"
    user: "{{ ansible_user }}"
  when: vault_healthcheck_backup_ha is defined
  tags: [homeassistant, backup, monitoring, cron]

- name: Configure Home Assistant update cron job
  ansible.builtin.cron:
    name: "Home Assistant update"
    minute: "0"
    hour: "3"
    day: "10"
    job: >
      {{ scripts_dir }}/enhanced_monitoring_wrapper
      --heartbeat-interval=always
      --notify-fixed=true
      {{ logging_token }}
      {{ alert_token }}
      {{ scripts_dir }}/update_ha
      >> {{ logs_dir }}/homeassistant_update.log 2>&1
    user: "{{ ansible_user }}"
  when:
    - logging_token is defined and logging_token != ''
    - alert_token is defined and alert_token != ''
  tags: [homeassistant, update, cron]

# ============================================================
# Internet Speed Monitoring
# ============================================================

- name: Deploy internet speed monitor script
  ansible.builtin.copy:
    src: "{{ inventory_dir }}/../../scripts/services/network/internet_speed_monitor"
    dest: "{{ scripts_dir }}/internet_speed_monitor"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  when: enable_internet_speed_check | default(false)
  tags: [homeassistant, monitoring, network]

- name: Configure internet speed monitoring cron job
  ansible.builtin.cron:
    name: "Internet speed check"
    minute: "0"
    hour: "*/6"
    job: >
      {{ scripts_dir }}/enhanced_monitoring_wrapper
      --heartbeat-interval=daily
      --notify-fixed=true
      --monitoring-name=internet_speed_check
      {{ logging_token }}
      {{ alert_token }}
      {{ scripts_dir }}/internet_speed_monitor
      --min-download={{ internet_speed_min_download | default(300) }}
      --min-upload={{ internet_speed_min_upload | default(150) }}
      --max-ping={{ internet_speed_max_ping | default(100) }}
      --tests={{ internet_speed_tests | default(3) }}
      --delay={{ internet_speed_delay | default(45) }}
      --silent
      >> {{ logs_dir }}/internet_speed_check.log 2>&1
    user: "{{ ansible_user }}"
  when:
    - enable_internet_speed_check | default(false)
    - logging_token is defined and logging_token != ''
    - alert_token is defined and alert_token != ''
  tags: [homeassistant, monitoring, cron, network]

# ============================================================
# Matter Server Configuration
# ============================================================

- name: Create Matter Server data directory
  ansible.builtin.file:
    path: "{{ matter_server_data_dir | default('/home/' + ansible_user + '/matter-server') }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  when: enable_matter_server | default(true)
  tags: [homeassistant, matter]

- name: Pull Matter Server Docker image
  community.docker.docker_image:
    name: "ghcr.io/home-assistant-libs/python-matter-server:{{ matter_server_version | default('stable') }}"
    source: pull
  become_user: "{{ ansible_user }}"
  when: enable_matter_server | default(true)
  tags: [homeassistant, matter, docker]

- name: Create and start Matter Server container
  community.docker.docker_container:
    name: matter-server
    image: "ghcr.io/home-assistant-libs/python-matter-server:{{ matter_server_version | default('stable') }}"
    restart_policy: unless-stopped
    network_mode: host
    security_opts:
      - "apparmor=unconfined"
    volumes:
      - "{{ matter_server_data_dir | default('/home/' + ansible_user + '/matter-server') }}:/data"
      - "/run/dbus:/run/dbus:ro"
    state: started
  become_user: "{{ ansible_user }}"
  when: enable_matter_server | default(true)
  tags: [homeassistant, matter, docker]

- name: Configure Matter Server container monitoring cron job
  ansible.builtin.cron:
    name: "Matter Server container check"
    minute: "*/10"
    job: >
      {{ scripts_dir }}/enhanced_monitoring_wrapper
      --heartbeat-interval=daily
      --notify-fixed=true
      --monitoring-name=matter_server_container
      {{ logging_token }}
      {{ alert_token }}
      {{ scripts_dir }}/check_container.sh {{ alert_token }} matter-server
      >> {{ logs_dir }}/matter_server_check.log 2>&1
    user: "{{ ansible_user }}"
  when:
    - enable_matter_server | default(true)
    - logging_token is defined and logging_token != ''
    - alert_token is defined and alert_token != ''
  tags: [homeassistant, matter, monitoring, cron]

# ============================================================
# MQTT Broker (Mosquitto) + Home Assistant integration
# ============================================================

- name: Deploy MQTT broker (Mosquitto)
  ansible.builtin.import_tasks: mqtt.yml
  when: enable_mqtt_broker | default(true)
  tags: [homeassistant, mqtt]

- name: Wire Home Assistant to the MQTT broker
  ansible.builtin.import_tasks: mqtt_ha_integration.yml
  when: enable_mqtt_broker | default(true)
  tags: [homeassistant, mqtt, ha_integration]

# ============================================================
# Thread border-router Wi-Fi leg
# ============================================================

- name: Deploy the Thread border-router Wi-Fi leg
  ansible.builtin.import_tasks: thread_wifi_link.yml
  when: enable_thread_wifi_link | default(false)
  tags: [homeassistant, thread, network]

# ============================================================
# Dashboard Configuration
# ============================================================

- name: Ensure Home Assistant .storage directory exists
  ansible.builtin.file:
    path: "{{ homeassistant_config_dir | default('/home/' + ansible_user + '/homeassistant') }}/.storage"
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: [homeassistant, dashboard]

- name: Deploy mobile dashboard configuration
  ansible.builtin.template:
    src: lovelace.dashboard_mobile.json.j2
    dest: "{{ homeassistant_config_dir | default('/home/' + ansible_user + '/homeassistant') }}/.storage/lovelace.dashboard_mobile"
    owner: root
    group: root
    mode: '0644'
  notify: Restart Home Assistant
  tags: [homeassistant, dashboard]

- name: Deploy dashboard registry
  ansible.builtin.template:
    src: lovelace_dashboards.json.j2
    dest: "{{ homeassistant_config_dir | default('/home/' + ansible_user + '/homeassistant') }}/.storage/lovelace_dashboards"
    owner: root
    group: root
    mode: '0644'
  notify: Restart Home Assistant
  tags: [homeassistant, dashboard]
