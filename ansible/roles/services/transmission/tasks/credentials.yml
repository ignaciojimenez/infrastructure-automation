# The RPC credentials come from vault, and nothing may stand in for them.
#
# Until 2026-11-28 the template fell back to `{changeme}` when no credential
# variable was set, and none ever was. Transmission reads a `{`-prefixed
# rpc-password as an existing hash, and `tr_ssha1_matches` (3.00) rejects any
# hash shorter than 41 characters, so that placeholder matched no input. The
# 2026-08-23 run replaced the working settings with it and locked RPC for
# everyone, and nothing reported it. A missing or malformed secret now fails
# the run here, before the daemon is stopped or the file is touched.
#
# The value is the hash, not the password: Transmission keeps a `{`-prefixed
# value verbatim, so the deployed file converges. Its format, from tr_ssha1:
# `{` + sha1(password + salt) as 40 lowercase hex + an 8-character salt from
# [0-9a-zA-Z./]. bin/transmission-rpc-credentials writes it into vault.
- name: Require vault-backed RPC credentials
  ansible.builtin.assert:
    that:
      - transmission_rpc_username is defined
      - transmission_rpc_username | length > 0
      - transmission_rpc_password_hash is defined
      - transmission_rpc_password_hash is match('^[{][0-9a-f]{40}[./0-9A-Za-z]{8}$')
    fail_msg: >-
      Transmission RPC credentials are missing or not a Transmission hash.
      Set vault_transmission_rpc_username and vault_transmission_rpc_password_hash
      with bin/transmission-rpc-credentials; nothing was changed on the host.
    quiet: true
