---
# Agent LXC service role — Phase A (Tier 1 fleet monitoring)
#
# Required variables:
#   agent_fleet_hosts — list of {name, kind}; see group_vars/agent.yml
#
# Optional variables: see defaults/main.yml
#
# Phase A deliberately installs no agent runtime and no API credential. The
# container's only capability is read-only SSH to the fleet as read_agent.

# ============================================================
# Packages
# ============================================================

- name: Install agent packages
  become: true
  ansible.builtin.apt:
    name:
      - openssh-client
      - jq       # enhanced_monitoring_wrapper parses its state file with jq
      - curl     # Slack delivery from the wrapper
    state: present
    update_cache: true
  when: os_family == "debian"
  tags: [agent, packages]

# ============================================================
# Container-resident SSH identity
# ============================================================

- name: Ensure .ssh directory exists
  become: true
  ansible.builtin.file:
    path: "/home/{{ primary_user }}/.ssh"
    state: directory
    owner: "{{ primary_user }}"
    group: "{{ infrastructure_group }}"
    mode: '0700'
  tags: [agent, ssh]

# Generated on the box and never leaves it — the private half exists in
# exactly one place. Only the public half is committed to the repo, so a
# rebuild mints a new identity rather than restoring an old one.
#
# ssh-keygen rather than community.crypto.openssh_keypair: that collection is
# not in this repo's dependency set and does not resolve under CI's
# ansible-lint. `creates` makes this idempotent without a separate stat.
- name: Check for the container's fleet SSH key
  ansible.builtin.stat:
    path: "{{ agent_ssh_key_path }}"
  register: agent_key_stat
  tags: [agent, ssh]

- name: Generate the container's fleet SSH key
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command:
    cmd: >-
      ssh-keygen -t {{ agent_ssh_key_type }} -N ''
      -C "{{ agent_ssh_key_comment }}"
      -f {{ agent_ssh_key_path }}
    creates: "{{ agent_ssh_key_path }}"
  tags: [agent, ssh]

- name: Read the container's public key
  become: true
  ansible.builtin.slurp:
    src: "{{ agent_ssh_key_path }}.pub"
  register: agent_pubkey
  when: not ansible_check_mode or agent_key_stat.stat.exists
  tags: [agent, ssh]

# Printed so it can be copied into group_vars/all/main.yml as
# agent_lxc_ssh_pubkey, which is what agent_access deploys fleet-wide.
- name: Show the container's public key
  ansible.builtin.debug:
    msg: "agent_lxc_ssh_pubkey: {{ agent_pubkey.content | b64decode | trim }}"
  when: agent_pubkey.content is defined
  tags: [agent, ssh]

- name: Deploy fleet SSH client config
  become: true
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "/home/{{ primary_user }}/.ssh/config"
    owner: "{{ primary_user }}"
    group: "{{ infrastructure_group }}"
    mode: '0600'
  tags: [agent, ssh, config]

# ============================================================
# Tier 1 fleet sweep
# ============================================================

- name: Ensure agent state directory exists
  become: true
  ansible.builtin.file:
    path: "{{ agent_state_dir }}"
    state: directory
    owner: "{{ primary_user }}"
    group: "{{ infrastructure_group }}"
    mode: '0750'
  tags: [agent, monitoring]

# site.yml does not push scripts/common/ (only the standalone
# deploy_monitoring.yml playbook does), so the role deploys the wrapper it
# depends on rather than assuming it. Same approach as roles/services/unifi.
- name: Deploy monitoring wrapper
  become: true
  ansible.builtin.copy:
    src: "{{ inventory_dir }}/../../scripts/common/enhanced_monitoring_wrapper"
    dest: "{{ scripts_dir }}/enhanced_monitoring_wrapper"
    owner: "{{ primary_user }}"
    group: "{{ infrastructure_group }}"
    mode: '0755'
  tags: [agent, monitoring, scripts]

- name: Deploy fleet health check script
  become: true
  ansible.builtin.template:
    src: "{{ inventory_dir }}/../../scripts/services/agent/fleet_health_check.sh.j2"
    dest: "{{ scripts_dir }}/fleet_health_check.sh"
    owner: "{{ primary_user }}"
    group: "{{ infrastructure_group }}"
    mode: '0755'
  tags: [agent, monitoring, scripts]

- name: Configure fleet health check cron job
  become: true
  ansible.builtin.cron:
    name: "Fleet health check (Tier 1)"
    minute: "{{ agent_sweep_minute }}"
    hour: "{{ agent_sweep_hour }}"
    job: >
      {{ scripts_dir }}/enhanced_monitoring_wrapper
      --heartbeat-interval=daily
      --notify-fixed=true
      {{ logging_token }}
      {{ alert_token }}
      {{ scripts_dir }}/fleet_health_check.sh
      >> {{ logs_dir }}/fleet_health_check.log 2>&1
    user: "{{ primary_user }}"
  when:
    - logging_token is defined and logging_token != ''
    - alert_token is defined and alert_token != ''
  tags: [agent, monitoring, cron]

- name: Report agent deployment status
  ansible.builtin.debug:
    msg: |
      ✅ Agent LXC (Tier 1) deployed
      Fleet sweep: {{ agent_fleet_hosts | length }} hosts, hourly at :{{ agent_sweep_minute }}
      Key: {{ agent_ssh_key_path }}
      State: {{ agent_state_dir }}/last_anomaly.json
      Phase B (agent runtime): not installed
  tags: [agent]

# ============================================================
# Phase B — OpenCode runtime and Tier 2 investigation
# ============================================================
#
# Everything below is inert unless enable_agent_investigate is true AND the
# vault holds an API key. A half-installed runtime with no credential would
# fail on a cron schedule and page you nightly, so the role skips instead.

- name: Configure Tier 2 investigation
  when:
    - enable_agent_investigate | bool
    - vault_anthropic_api_key is defined
  tags: [agent, investigate]
  block:
    - name: Check the installed OpenCode version
      ansible.builtin.command:
        cmd: "{{ opencode_bin }} --version"
      register: opencode_installed
      check_mode: false  # read-only probe; must run under --check
      failed_when: false
      changed_when: false

    # Pinned + checksummed. get_url verifies the digest before anything is
    # extracted, so a tampered or truncated download fails closed rather than
    # installing. The expected hash comes from the GitHub release API, not
    # from hashing whatever we downloaded first (which would verify nothing).
    - name: Install the pinned OpenCode release
      when: opencode_version not in (opencode_installed.stdout | default(''))
      block:
        - name: Download the OpenCode release
          become: true
          ansible.builtin.get_url:
            url: "https://github.com/sst/opencode/releases/download/v{{ opencode_version }}/{{ opencode_asset }}"
            dest: "/tmp/{{ opencode_asset }}"
            checksum: "sha256:{{ opencode_sha256 }}"
            mode: '0644'
            timeout: 120

        - name: Create the OpenCode install directory
          become: true
          ansible.builtin.file:
            path: "{{ opencode_install_dir }}/{{ opencode_version }}"
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Extract OpenCode
          become: true
          ansible.builtin.unarchive:
            src: "/tmp/{{ opencode_asset }}"
            dest: "{{ opencode_install_dir }}/{{ opencode_version }}"
            remote_src: true
            owner: root
            group: root

        - name: Link the pinned OpenCode into PATH
          become: true
          ansible.builtin.file:
            src: "{{ opencode_install_dir }}/{{ opencode_version }}/opencode"
            dest: "{{ opencode_bin }}"
            state: link
            force: true

      always:
        - name: Remove the downloaded archive
          become: true
          ansible.builtin.file:
            path: "/tmp/{{ opencode_asset }}"
            state: absent

    # ------------------------------------------------------------
    # Configuration as code
    # ------------------------------------------------------------

    - name: Ensure OpenCode config directories exist
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ primary_user }}"
        group: "{{ infrastructure_group }}"
        mode: '0750'
      loop:
        - "/home/{{ primary_user }}/.config/opencode"
        - "/home/{{ primary_user }}/.config/opencode/agents"
        - "{{ agent_plans_dir }}"

    - name: Deploy OpenCode configuration
      become: true
      ansible.builtin.template:
        src: opencode.json.j2
        dest: "/home/{{ primary_user }}/.config/opencode/opencode.json"
        owner: "{{ primary_user }}"
        group: "{{ infrastructure_group }}"
        mode: '0640'

    - name: Deploy the infra-monitor agent definition
      become: true
      ansible.builtin.template:
        src: infra-monitor.md.j2
        dest: "/home/{{ primary_user }}/.config/opencode/agents/infra-monitor.md"
        owner: "{{ primary_user }}"
        group: "{{ infrastructure_group }}"
        mode: '0640'

    - name: Deploy fleet context for the agent
      become: true
      ansible.builtin.template:
        src: AGENTS.md.j2
        dest: "/home/{{ primary_user }}/.config/opencode/AGENTS.md"
        owner: "{{ primary_user }}"
        group: "{{ infrastructure_group }}"
        mode: '0640'

    # ------------------------------------------------------------
    # Credential — 0600, sourced by scripts, never in a cron argument
    # ------------------------------------------------------------

    - name: Ensure the agent credential directory exists
      become: true
      ansible.builtin.file:
        path: "{{ agent_env_file | dirname }}"
        state: directory
        owner: root
        group: "{{ infrastructure_group }}"
        mode: '0750'

    - name: Deploy the agent credential file
      become: true
      ansible.builtin.template:
        src: agent.env.j2
        dest: "{{ agent_env_file }}"
        owner: root
        group: "{{ infrastructure_group }}"
        mode: '0640'
      no_log: true

    # ------------------------------------------------------------
    # Tier 2 wiring
    # ------------------------------------------------------------

    - name: Deploy the investigate script
      become: true
      ansible.builtin.template:
        src: "{{ inventory_dir }}/../../scripts/services/agent/investigate.sh.j2"
        dest: "{{ scripts_dir }}/investigate.sh"
        owner: "{{ primary_user }}"
        group: "{{ infrastructure_group }}"
        mode: '0755'

    # Deliberately a separate cron from the Tier 1 sweep rather than being
    # called by it: Tier 1 stays free, independent, and unable to be broken by
    # a Tier 2 failure. This polls for a *newer* anomaly snapshot and exits
    # without spending anything when there is nothing new.
    - name: Configure the anomaly investigation cron job
      become: true
      ansible.builtin.cron:
        name: "Fleet anomaly investigation (Tier 2)"
        minute: "{{ agent_investigate_minute }}"
        hour: "*"
        job: >
          {{ scripts_dir }}/investigate.sh
          >> {{ logs_dir }}/investigate.log 2>&1
        user: "{{ primary_user }}"

    - name: Configure the weekly digest cron job
      become: true
      ansible.builtin.cron:
        name: "Weekly fleet digest (Tier 2)"
        minute: "{{ agent_digest_minute }}"
        hour: "{{ agent_digest_hour }}"
        weekday: "{{ agent_digest_weekday }}"
        job: >
          {{ scripts_dir }}/investigate.sh --digest
          >> {{ logs_dir }}/investigate.log 2>&1
        user: "{{ primary_user }}"

    # Slack watch — only scheduled once a read token exists. The script itself
    # also no-ops without the token, so this is belt-and-braces: no token means
    # no cron and no work.
    - name: Configure the Slack watch cron job
      become: true
      ansible.builtin.cron:
        name: "Slack alert watch (Tier 2)"
        minute: "{{ agent_slack_watch_minute }}"
        hour: "*"
        job: >
          {{ scripts_dir }}/investigate.sh --slack
          >> {{ logs_dir }}/investigate.log 2>&1
        user: "{{ primary_user }}"
        state: "{{ 'present' if vault_slack_read_token is defined else 'absent' }}"
      tags: [agent, investigate, slack]

    - name: Report Tier 2 deployment status
      ansible.builtin.debug:
        msg: |
          ✅ Tier 2 (OpenCode {{ opencode_version }}) deployed
          Monitor model: {{ agent_monitor_model }}
          Digest model:  {{ agent_digest_model }}
          Plans:         {{ agent_plans_dir }}
          Investigate:   hourly at :{{ agent_investigate_minute }} (only when a new anomaly exists)
