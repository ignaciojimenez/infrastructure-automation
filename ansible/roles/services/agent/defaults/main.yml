---
# Agent LXC role defaults
# Override in group_vars/agent.yml or host_vars/.
#
# Phase A scope: a container-resident SSH identity plus the Tier 1 fleet
# sweep. No agent runtime, no API key, no model calls.

enable_agent: true

# Where the sweep keeps state Tier 2 will later consume (last_anomaly.json).
agent_state_dir: "/home/{{ primary_user }}/.agent"

# Container-resident key. Passphrase-free by necessity — it runs unattended
# from cron. It is constrained instead by the from= pin in read_agent's
# authorized_keys, read-only sudo on the far side, and revocation in a single
# agent_access.yml run. Never reused as an admin credential.
agent_ssh_key_path: "/home/{{ primary_user }}/.ssh/agent_lxc_ed25519"
agent_ssh_key_type: ed25519
agent_ssh_key_comment: "agent-lxc fleet observer (read_agent)"

# Tier 1 sweep schedule. Offset from the top of the hour so it does not land
# on the same minute as the fleet's own */10 and */15 monitoring crons.
agent_sweep_minute: "37"
agent_sweep_hour: "*"

# Dead-man's switch for the sweep itself — the one thing the sweep cannot
# report, because a sweep that does not run reports nothing at all. This
# container ran ZERO jobs for its first 12 days and nobody noticed, which is
# the failure mode every other host is already covered against.
#
# Empty by default so the script degrades to "no ping" rather than curling a
# literal `{{ ... }}` when the vault entry is absent (e.g. a test render).
# Check: "agent-lxc Tier 1 fleet sweep", period 1h, grace 25m.
agent_sweep_healthcheck_url: "{{ vault_healthcheck_agent_sweep | default('') }}"

# Fleet sweep tuning — documented in group_vars/agent.yml, which is the
# intended place to change them.
agent_disk_threshold: 85
agent_wrapper_max_age_hours: 26
agent_ssh_timeout: 15

# Mullvad relay signal (docs/TODO.md item 41). Off until the relay list is set
# in group_vars/agent.yml. Hourly at :29 — clear of this role's :07/:14/:17/:20/
# :37/:47 jobs, and of the fleet's */5, */10 and */15 crons, which all land on
# multiples of five.
enable_mullvad_relay_signal: false
agent_mullvad_relays: []
agent_mullvad_signal_minute: "29"
agent_mullvad_signal_hour: "*"
agent_mullvad_relays_file: "{{ agent_state_dir }}/mullvad_relays.list"
agent_fleet_hosts: []

# ------------------------------------------------------------
# opnsense — checked over its API, never over SSH
# ------------------------------------------------------------
# Reached by IP, with the certificate's own name supplied via curl --resolve.
# That is not a workaround for missing DNS: it removes the firewall's resolver
# from the path of the check that watches the firewall.
agent_opnsense_api_ip: "10.30.40.254"

# The firewall's web-certificate PUBLIC KEY, pinned.
#
# ⚠️ Deliberately the key and not the certificate. OPNsense serves a self-signed
# certificate and does NOT auto-renew it (opnsense/core#4567 and #7385 are open
# feature requests for exactly that), so pinning the certificate guarantees a
# page on its expiry date — an alert about a calendar rather than about the
# firewall, and Ignacio's explicit position is that certificate lifecycle is the
# software's problem, not something to monitor.
#
# Key pinning has no expiry cliff. Verified 2026-08-17 against a purpose-built
# expired certificate: `-k --pinnedpubkey` with the right key succeeds, with the
# wrong key fails curl exit 90, while `--cacert` fails exit 60 on the same cert.
# So this still refuses a substituted certificate — the only property worth
# having on a LAN path we do not otherwise trust — without ever firing on a date.
#
# Regenerate (only if OPNsense is made to reissue the certificate):
#   echo | openssl s_client -connect 10.30.40.254:443 2>/dev/null \
#     | openssl x509 -pubkey -noout \
#     | openssl pkey -pubin -outform der | openssl dgst -sha256 -binary \
#     | openssl base64
agent_opnsense_api_pubkey_pin: "sha256//eX/oOnHGacY+Z41pCAhi2/cxAREZHgcqW5ODY4yisJA="

# 0600, primary-user-owned. Read by the sweep and fed to curl on stdin, so the
# secret never appears in argv or the environment.
agent_opnsense_api_creds_path: "{{ agent_state_dir }}/opnsense_api.creds"

agent_opnsense_api_timeout: 15

# ------------------------------------------------------------
# opnsense monitoring freshness, answered from OUTSIDE the fleet
# ------------------------------------------------------------
# On Linux hosts this is `journalctl -u cron`, because Debian's cron syslogs
# every CMD it runs. FreeBSD's does not, so there is no equivalent evidence on
# the firewall to read — over the API or otherwise. healthchecks.io answers it
# instead, which does not depend on the firewall being well enough to reply, nor
# on this container.
#
# ⚠️ Must be the UNCONDITIONAL check fed by heartbeat_monitoring.sh, never the
# WAN or DNS ones. Those ping only when the thing they check is healthy, so a
# stale timestamp on them conflates "monitoring stopped" with "WAN is down" —
# the two states this exists to separate.
#
# Matched by name because a read-only healthchecks.io key omits `uuid` and
# exposes only `unique_key`; the name is the stable identifier available to the
# least-privileged key that can answer the question. **Renaming the check in the
# healthchecks.io UI breaks this** — the sweep then reports UNKNOWN, which is the
# intended failure direction but still needs fixing here.
agent_opnsense_monitoring_check_name: "OPNsense monitoring alive"

# 0600, primary-user-owned, one `api_key=` line. Read-only key: nothing on this
# container should be able to pause or delete a check.
agent_healthchecks_api_key_file: "{{ agent_state_dir }}/healthchecks_api.creds"

# Back-off applied to a host that REJECTS this container's SSH key, doubling
# from the base and capped at the max. Only failed *authentication* backs off:
# a host that is simply down trips no IPS and is retried every sweep.
#
# Base is one sweep, so a transient rejection costs one skipped probe. The cap
# bounds how long a recovered host stays unprobed — 6h, i.e. the sweep notices
# a restored key within six hours rather than within one. That is the price of
# not re-authenticating hourly against a firewall that bans on failed auth.
agent_ssh_backoff_base_seconds: 3600   # 1h
agent_ssh_backoff_max_seconds: 21600   # 6h

# How many hosts must go silent in one sweep before the finding is reported as
# a single fleet-wide event instead of one per host.
#
# 3 of 7, chosen against the two measured power events rather than picked: both
# took SIX hosts inside a 15-second window, so any threshold up to 6 collapses
# them. The floor is set by what could plausibly be a coincidence — two hosts
# failing independently in the same hour is believable, three is not, and three
# is also the smallest count where the per-host form starts to be harder to read
# than the collapsed one.
#
# Set it above the fleet size to disable collapsing entirely.
agent_fleet_wide_threshold: 3

# ============================================================
# Phase B — OpenCode runtime and Tier 2 investigation
# ============================================================

# Master toggle. Everything below is inert until this is true AND
# vault_anthropic_api_key exists — the role skips rather than half-installs.
enable_agent_investigate: false

# Pinned release. Upgrading is bumping these two together; the checksum comes
# from the GitHub release API (`gh release view <tag> --json assets`), not from
# hashing whatever we happened to download.
opencode_version: "1.18.4"
opencode_sha256: "bab463c3fb3224d388bb7cfad63f38703df9cf0be2cfd2ce8cb49d886b53a174"
# glibc build — Debian 13. The -musl asset is for Alpine and will not run here.
opencode_asset: "opencode-linux-x64.tar.gz"
opencode_install_dir: "/opt/opencode"
opencode_bin: "/usr/local/bin/opencode"

# Models are per-agent and provider-qualified ("<provider>/<model>"), so
# switching provider is a variable change and a redeploy — no code, no
# re-architecture. See docs/ARCHITECTURE_DECISIONS.md for why cost is not the
# driver here.
#
# Triage is high-volume and zero-blast-radius (it only reports), so it is the
# right place to trade capability for cost — and the right place to A/B an
# open-weight model against Haiku on real anomalies.
agent_monitor_model: "anthropic/claude-haiku-4-5"
# The weekly digest is one-shot and reads a week of context; worth a better model.
agent_digest_model: "anthropic/claude-sonnet-5"
# Used by OpenCode for incidental work (session titles). Keep it cheap.
agent_small_model: "anthropic/claude-haiku-4-5"

agent_provider_timeout_ms: 600000

# Bounds a runaway loop. An investigation that cannot conclude in this many
# steps is one a human should look at anyway.
agent_max_steps: 40

# Hard wall-clock cap on a single opencode invocation. Observed: a run can
# finish its reasoning but the process fails to exit; without this cap that
# hangs investigate.sh indefinitely while it holds the flock, stalling all
# Tier 2 work. 10 min is well above a normal investigation (~2-5 min).
agent_run_timeout_seconds: 600

# Credentials live in a 0600 env file sourced by the scripts — never in a cron
# argument, where `crontab -l`, `ps`, and cron mail would all leak them.
agent_env_file: "/etc/agent/agent.env"
agent_plans_dir: "{{ agent_state_dir }}/plans"

# Runs 10 minutes after the Tier 1 sweep at :{{ agent_sweep_minute }}, giving
# it time to finish writing the snapshot. Exits immediately (and free) unless
# the snapshot is newer than the last one investigated.
agent_investigate_minute: "47"

# Cap on how often Tier 2 may alert about its OWN failure. A persistent
# anomaly retries hourly by design; without this each retry re-alerts.
agent_failure_alert_cooldown_seconds: 21600  # 6h

# ------------------------------------------------------------
# Slack watch — investigate failures the hourly sweep can't see
# ------------------------------------------------------------
# The Tier 1 sweep only sees what read_agent can see (failed systemd units,
# disk, monitoring freshness). Per-service wrapper failures and Home Assistant
# alerts (heating offline, Shelly) only ever appear in #home-alerts. This mode
# reads that channel and investigates NEW failure alerts. The read is done by
# the trusted script, not the agent — the agent's SSH-only allowlist is
# untouched. Gated on vault_slack_read_token; inert until it exists.
agent_slack_channel: "C01J36V2FPE"  # #home-alerts (channel IDs are not secret)
agent_slack_watch_minute: "7"

# A poll launches at most ONE investigation, covering every new incident in it.
# This caps how many distinct incidents that one run is handed, so a burst of
# alerts cannot grow the prompt without bound.
agent_slack_max_per_run: 3

# ------------------------------------------------------------
# Incidents — how long one paid investigation covers a (host, subject)
# ------------------------------------------------------------
# Shared by the anomaly and Slack modes, keyed by host AND what is failing on it
# (investigate.sh explains why neither by message nor by host alone). The same
# key named again within the quiet window is the same incident and is not
# re-investigated; a different subject on the same host is.
#
# ⚠️ Must exceed the wrapper's --alert-repeat-max (24h). A still-failing check
# re-posts at least that often, and each post is what keeps the incident open;
# shorter, and a fault whose reminders have backed off looks resolved and is
# re-billed. 26 matches agent_wrapper_max_age_hours for the same reason.
agent_incident_quiet_hours: 26

# Even an incident that never goes quiet is re-investigated once past this age,
# so an unfixed fault gets a fresh look weekly and a second, unrelated fault on
# the same host cannot hide behind the first indefinitely.
agent_incident_max_age_days: 7

# Backstop, not the control: past this much Tier 2 spend in one UTC day the
# anomaly and Slack modes stop until midnight UTC (the weekly digest still
# runs). The worst real day measured so far would have been ~$1.11 under the
# incident dedup, digest included; this sits above it. 0 disables.
agent_daily_spend_cap_usd: 2.00

# Weekly digest — Sunday morning, offset from the hourly sweep.
agent_digest_weekday: "0"
agent_digest_hour: "9"
agent_digest_minute: "17"

# ------------------------------------------------------------
# Shared, root-owned code
# ------------------------------------------------------------
# incident_subjects.py is the one definition of an incident key, read by
# investigate.sh (agent account) and fleet_linear_sync.sh (root). Root-owned so
# the root-run filer never executes anything the agent account can rewrite.
agent_lib_dir: /usr/local/lib/agent
agent_incident_subjects_py: "{{ agent_lib_dir }}/incident_subjects.py"

# ------------------------------------------------------------
# Linear filer — Tier 1 findings become agent/fleet issues (PER-85 part 1)
# ------------------------------------------------------------
# Deterministic; the model never touches Linear. Off until the vault holds a
# key: Linear API key, Read + Write, team PER only, never Admin (Linear's key
# settings allow both restrictions). Rendered into a root-only header file the
# agent account cannot read.
enable_agent_linear_sync: "{{ vault_linear_fleet_api_key is defined }}"
agent_linear_dir: /etc/fleet-linear
agent_linear_auth_file: "{{ agent_linear_dir }}/auth.header"
agent_linear_state_dir: /var/lib/fleet-linear
agent_linear_log: /var/log/fleet_linear_sync.log
agent_linear_endpoint: "https://api.linear.app/graphql"

# Workspace ids, not secrets: useless without a key. Static so the filer makes
# no lookups, and fails loudly (GraphQL error) if one is ever deleted.
agent_linear_team_id: "321cb6ff-678a-4e87-b4e8-5c9464de53c8"         # PER
agent_linear_project_id: "2efb28ec-c35f-4aa7-a859-ea3628095d75"      # Fleet
agent_linear_todo_state_id: "ab858e0f-c915-4b4b-baf4-99706f9f8210"   # Todo
agent_linear_done_state_id: "5e4e5d0d-d7df-4754-bf08-bf14f1862090"   # Done
agent_linear_fleet_label_id: "1215bd1c-a99a-4a04-babe-cea3558c085f"  # agent/fleet
agent_linear_broken_label_id: "21bd5e64-d3f3-4906-bfcd-315e3194e5e6" # kind/broken

# The identity marker's URL is this plus the incident key. Points at the
# operator doc so the attachment is a useful link, not just a key.
agent_linear_incident_url_base: "https://github.com/ignaciojimenez/infrastructure-automation/blob/main/docs/AGENT_LXC.md?incident="

# Close after this long absent on sweeps that observed the host — the queue
# protocol's agent/* rule (dotfiles docs/queue.md).
agent_linear_close_after_seconds: 86400
# The sweep is hourly; two missed runs means it has stopped, and the filer
# fails rather than reconcile against an old picture.
agent_linear_stale_after_seconds: 7200

# :57 — after the :37 sweep and the :47 anomaly investigation, so a new
# finding and its plan usually land in the same run.
agent_linear_minute: "57"

# The builder's draft PRs (PER-85 part 2), read without a token: the repo is
# public. The 100 most recent PRs, newest first — one request per run, well
# inside GitHub's 60/h unauthenticated limit. Only PRs whose author is the
# builder's login AND whose head is this repo are believed.
agent_builder_login: ignaciojimenez-builder
agent_builder_repo: "{{ gh_profile }}/infrastructure-automation"
agent_builder_pulls_url: "https://api.github.com/repos/{{ agent_builder_repo }}/pulls?state=all&sort=created&direction=desc&per_page=100"
