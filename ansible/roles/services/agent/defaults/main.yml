---
# Agent LXC role defaults
# Override in group_vars/agent.yml or host_vars/.
#
# Phase A scope: a container-resident SSH identity plus the Tier 1 fleet
# sweep. No agent runtime, no API key, no model calls.

enable_agent: true

# Where the sweep keeps state Tier 2 will later consume (last_anomaly.json).
agent_state_dir: "/home/{{ primary_user }}/.agent"

# Container-resident key. Passphrase-free by necessity — it runs unattended
# from cron. It is constrained instead by the from= pin in read_agent's
# authorized_keys, read-only sudo on the far side, and revocation in a single
# agent_access.yml run. Never reused as an admin credential.
agent_ssh_key_path: "/home/{{ primary_user }}/.ssh/agent_lxc_ed25519"
agent_ssh_key_type: ed25519
agent_ssh_key_comment: "agent-lxc fleet observer (read_agent)"

# Tier 1 sweep schedule. Offset from the top of the hour so it does not land
# on the same minute as the fleet's own */10 and */15 monitoring crons.
agent_sweep_minute: "37"
agent_sweep_hour: "*"

# Fleet sweep tuning — documented in group_vars/agent.yml, which is the
# intended place to change them.
agent_disk_threshold: 85
agent_wrapper_max_age_hours: 26
agent_ssh_timeout: 15
agent_fleet_hosts: []

# ============================================================
# Phase B — OpenCode runtime and Tier 2 investigation
# ============================================================

# Master toggle. Everything below is inert until this is true AND
# vault_anthropic_api_key exists — the role skips rather than half-installs.
enable_agent_investigate: false

# Pinned release. Upgrading is bumping these two together; the checksum comes
# from the GitHub release API (`gh release view <tag> --json assets`), not from
# hashing whatever we happened to download.
opencode_version: "1.18.4"
opencode_sha256: "bab463c3fb3224d388bb7cfad63f38703df9cf0be2cfd2ce8cb49d886b53a174"
# glibc build — Debian 13. The -musl asset is for Alpine and will not run here.
opencode_asset: "opencode-linux-x64.tar.gz"
opencode_install_dir: "/opt/opencode"
opencode_bin: "/usr/local/bin/opencode"

# Models are per-agent and provider-qualified ("<provider>/<model>"), so
# switching provider is a variable change and a redeploy — no code, no
# re-architecture. See docs/ARCHITECTURE_DECISIONS.md for why cost is not the
# driver here.
#
# Triage is high-volume and zero-blast-radius (it only reports), so it is the
# right place to trade capability for cost — and the right place to A/B an
# open-weight model against Haiku on real anomalies.
agent_monitor_model: "anthropic/claude-haiku-4-5"
# The weekly digest is one-shot and reads a week of context; worth a better model.
agent_digest_model: "anthropic/claude-sonnet-5"
# Used by OpenCode for incidental work (session titles). Keep it cheap.
agent_small_model: "anthropic/claude-haiku-4-5"

agent_provider_timeout_ms: 600000

# Bounds a runaway loop. An investigation that cannot conclude in this many
# steps is one a human should look at anyway.
agent_max_steps: 40

# Credentials live in a 0600 env file sourced by the scripts — never in a cron
# argument, where `crontab -l`, `ps`, and cron mail would all leak them.
agent_env_file: "/etc/agent/agent.env"
agent_plans_dir: "{{ agent_state_dir }}/plans"

# Runs 10 minutes after the Tier 1 sweep at :{{ agent_sweep_minute }}, giving
# it time to finish writing the snapshot. Exits immediately (and free) unless
# the snapshot is newer than the last one investigated.
agent_investigate_minute: "47"

# Cap on how often Tier 2 may alert about its OWN failure. A persistent
# anomaly retries hourly by design; without this each retry re-alerts.
agent_failure_alert_cooldown_seconds: 21600  # 6h

# Weekly digest — Sunday morning, offset from the hourly sweep.
agent_digest_weekday: "0"
agent_digest_hour: "9"
agent_digest_minute: "17"
