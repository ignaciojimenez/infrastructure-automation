---
# Docker installation and configuration role

# The one-line docker.list is superseded by docker.sources. Removed before any
# apt run, or apt sees the repository twice and warns on every update.
- name: Remove the legacy docker.list superseded by docker.sources
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  tags: [docker]

- name: Install Docker prerequisites
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - apt-transport-https
    state: present
    update_cache: true
  tags: [docker, packages]

- name: Validate Docker GPG key URL uses HTTPS
  ansible.builtin.assert:
    that:
      - "(docker_key_url | default('https://download.docker.com/linux/raspbian/gpg')) is match('^https://')"
    fail_msg: "docker_key_url must use https://"
  when: docker_key_url is defined
  tags: [docker]

- name: Download Docker GPG key
  become: true
  ansible.builtin.get_url:
    url: "{{ docker_key_url | default('https://download.docker.com/linux/raspbian/gpg') }}"
    dest: "{{ docker_key_file | default('/usr/share/keyrings/docker.asc') }}"
    force: true
    mode: '0644'
  tags: [docker]

- name: Get system architecture
  ansible.builtin.command: dpkg --print-architecture
  register: architecture_result
  changed_when: false
  tags: [docker]

# deb822_repository needs python3-debian even under --check; it is installed
# here rather than via install_python_debian so a dry run stays a dry run.
- name: Ensure python3-debian is present for deb822 repository management
  become: true
  ansible.builtin.apt:
    name: python3-debian
    state: present
  tags: [docker, packages]

- name: Add Docker repository
  become: true
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "{{ docker_distro_url | default('https://download.docker.com/linux/debian') }}"
    suites: "{{ ansible_distribution_release }}"
    components: [stable]
    architectures: ["{{ architecture_result.stdout }}"]
    signed_by: "{{ docker_key_file | default('/usr/share/keyrings/docker.asc') }}"
    enabled: true
    state: present
  tags: [docker]

- name: Install Docker packages
  become: true
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - python3-docker
    state: present
    install_recommends: true
    force_apt_get: true
    update_cache: true
  tags: [docker, packages]

- name: Create docker group
  become: true
  ansible.builtin.group:
    name: docker
    state: present
  tags: [docker]

- name: Add user to docker group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  tags: [docker]

- name: Reset SSH connection for group changes
  ansible.builtin.meta: reset_connection
  tags: [docker]

- name: Configure Docker daemon
  become: true
  ansible.builtin.copy:
    content: "{{ docker_daemon_options | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  when: docker_daemon_options | length > 0
  notify: restart docker
  tags: [docker]

- name: Start and enable Docker service
  become: true
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true
  tags: [docker]
