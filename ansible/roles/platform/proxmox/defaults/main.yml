---
# platform/proxmox role defaults

# Thermal headroom tuning (see docs/ARCHITECTURE_DECISIONS.md).
# The N355 is a ~15W-class part but ships with RAPL PL1=35W into a marginal cooler;
# capping sustained power keeps a future airflow loss in graceful-throttle territory
# instead of a silent THERMTRIP. No throughput impact at a 1 Gbps WAN.
enable_proxmox_power_tuning: true
proxmox_rapl_pl1_watts: 20        # sustained (long-term) package power cap; PL2 burst left at firmware default
proxmox_cpu_governor: powersave   # intel_pstate dynamic mode; still boosts to max under load

# KSM (Kernel Samepage Merging) -- kept off on cwwk. It is a continuous all-core
# background scan worth ~3 C of package temperature on this cooling-marginal box,
# and it pays nothing back: general_profit measured NEGATIVE (~192 MiB of rmap
# overhead against ~208 KiB actually shared), because cwwk runs one large FreeBSD
# VM plus LXCs that already share the host kernel -- there is almost nothing to
# merge. Set false to hand KSM back to ksmtuned if guest topology ever becomes
# many near-identical VMs. See docs/ARCHITECTURE_DECISIONS.md.
proxmox_disable_ksm: true

# vzdump nightly backup -- I/O bandwidth cap (see docs/ARCHITECTURE_DECISIONS.md).
# The 03:00 job reads VM 100's full 64 GiB disk. Uncapped it sustains ~288 MiB/s and
# finishes in ~4 min, but holds the package at a 78-79 C mean and spends ~125 s above
# 80 C. Capped at 100 MiB/s it takes ~11 min at a 64 C mean and ~15 s above 80 C --
# an 8x cut in time-at-high-temperature, measured A/B on 2026-09-05.
#
# 📌 The PEAK barely moves (86 -> 85 C). What falls is time AT temperature, which is
# what actually drives throttling; do not expect this knob to lower the maximum.
#
# ⚠️ Do NOT tune this by throttle-event count. Two IDENTICAL uncapped control runs
# scored 48 and 79 events, so single-run resolution is ~+/-30 -- finer tuning is
# below the instrument's noise floor. Judge it on time-above-80 C instead.
#
# 0 disables the cap. Set on the host in /etc/vzdump.conf, which PVE reads as
# defaults for every vzdump invocation including scheduled jobs
# (PVE::VZDump::read_vzdump_defaults, applied for any key the job does not define).
proxmox_vzdump_bwlimit_kib: 102400   # 100 MiB/s

# The backup dataset holds vzdump's own zstd archives, so ZFS compression has nothing
# left to find: measured compressratio was exactly 1.00x, i.e. a pointless pass over
# ~17 GB every night. Empty string skips the ZFS change entirely.
proxmox_backup_dataset: rpool/var-lib-vz
proxmox_backup_dataset_compression: "off"

# vzdump retention -- how many local copies survive in /var/lib/vz/dump.
# Measured 2026-09-17: keep-daily=15 held 261 GiB of VM 100 alone (~17.4 GiB a
# night) on a pool that was 73% full at 55% fragmentation. ZFS degrades past
# ~80%, so disk -- not CPU or RAM -- was the binding constraint on this box.
#
# Retention lives on the BACKUP JOB, not in /etc/vzdump.conf and not on the
# storage: `pvesh get /cluster/backup` returns prune-backups per job, and a
# job-level value wins over the file -- the same precedence that forces bwlimit
# to be file-only. So the job is the only place this can be set to stick.
#
# This is a RECOVERY decision, not a disk decision. The USB copy keeps only
# 2 generations, so these dailies are the deeper history; keep-weekly buys
# reach to a fault noticed a fortnight later for ~1/5 of the space.
proxmox_vzdump_keep_daily: 3
proxmox_vzdump_keep_weekly: 2

# The API returns prune-backups values as strings, so the comparison that makes
# the task idempotent has to be string-valued too.
#
# The `| string` is load-bearing and was caught by testing the condition against
# real `pvesh` output: without it Ansible's native-type Jinja renders "{{ 3 }}"
# as the INT 3, which never equals the API's STR "3", so the task would fire on
# every run and report changed for ever -- the exact shape of a check that looks
# like it works because it is always doing something.
proxmox_vzdump_prune_desired:
  keep-daily: "{{ proxmox_vzdump_keep_daily | string }}"
  keep-weekly: "{{ proxmox_vzdump_keep_weekly | string }}"

# Journald: explicit persistence + size cap (see docs/ARCHITECTURE_DECISIONS.md).
# 4G matches systemd's implicit ceiling and keeps ~3 months of forensic history
# at the observed ~1.2G/month; cwwk is the host where journal forensics matter most.
enable_persistent_journal: true
journald_system_max_use: 4G
journald_system_max_file_size: 128M   # 32 rotation slots at 4G; finer-grained vacuuming
