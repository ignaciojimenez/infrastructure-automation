---
# Raspberry Pi-specific configuration

- name: Configure Raspberry Pi specific settings
  hosts: raspberrypi
  become: true
  handlers:
    - name: Reboot required
      ansible.builtin.debug:
        msg: "Reboot required - will be handled at end of playbook"
      listen: "reboot_required"

    - name: Restart journald
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted
      listen: "journald_config_changed"

    - name: Flush runtime journal to persistent storage
      ansible.builtin.command: journalctl --flush
      changed_when: true
      listen: "journald_config_changed"
  tasks:
    - name: Raspberry Pi memory optimizations
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-raspberry-pi.conf
      loop:
        - { name: 'vm.swappiness', value: '10' }
        - { name: 'vm.vfs_cache_pressure', value: '50' }
      when: platform_type == "raspberrypi"
      tags: [raspberrypi, optimization]

    # Persistent journal: default Storage=auto keeps logs in /run (lost on reboot),
    # which made the 2026-07-12 vinylstreamer reboot un-post-mortemable. Size caps
    # and compression bound SD-card wear on these small SD-backed hosts.
    - name: Ensure journald drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'
      when:
        - platform_type == "raspberrypi"
        - enable_persistent_journal | default(true)
      tags: [raspberrypi, journald]

    - name: Configure persistent journald with SD-wear caps
      ansible.builtin.copy:
        content: |
          # Managed by Ansible (playbooks/platform/raspberrypi.yml) - do not edit
          [Journal]
          Storage=persistent
          Compress=yes
          SystemMaxUse={{ journald_system_max_use | default('100M') }}
          SystemMaxFileSize={{ journald_system_max_file_size | default('16M') }}
        dest: /etc/systemd/journald.conf.d/persistent.conf
        owner: root
        group: root
        mode: '0644'
      when:
        - platform_type == "raspberrypi"
        - enable_persistent_journal | default(true)
      notify: "journald_config_changed"
      tags: [raspberrypi, journald]

    # ── config.txt: write to the file the firmware actually reads ───────────
    # On Bookworm the boot partition is mounted at /boot/firmware, and
    # /boot/config.txt is a 112-byte placeholder whose first line reads
    # "DO NOT EDIT THIS FILE". On Bullseye and earlier, /boot IS the boot
    # partition. Writing to the wrong one fails silently — lineinfile appends
    # happily and nothing ever reads it.
    #
    # 🐛 Not hypothetical. This task pointed at /boot/config.txt, so dockassist,
    # hifipi and vinylstreamer each carried dtoverlay=disable-bt in the
    # placeholder while the radio stayed enabled. Bluetooth was off on those
    # hosts only because the service task below genuinely worked. Found
    # 2026-08-22 while tracing why a Wi-Fi disable had never taken effect.
    - name: Locate the boot partition
      ansible.builtin.command: findmnt -no TARGET /boot/firmware
      register: rpi_boot_mount
      changed_when: false
      failed_when: false
      check_mode: false
      when: platform_type == "raspberrypi"
      tags: [raspberrypi, optimization, bluetooth]

    - name: Resolve the config.txt the firmware reads
      ansible.builtin.set_fact:
        rpi_boot_config: "{{ '/boot/firmware/config.txt' if (rpi_boot_mount.stdout | default('') | trim) == '/boot/firmware' else '/boot/config.txt' }}"
      when: platform_type == "raspberrypi"
      tags: [raspberrypi, optimization, bluetooth]

    - name: Read the resolved config.txt
      ansible.builtin.slurp:
        src: "{{ rpi_boot_config }}"
      register: rpi_boot_config_raw
      when: platform_type == "raspberrypi"
      tags: [raspberrypi, optimization, bluetooth]

    # A boot config is the one file here that can cost a physical trip to the Pi.
    # Refuse to touch anything that does not look like the real thing.
    - name: Refuse to edit a config.txt that is not the real one
      ansible.builtin.assert:
        that:
          - "'DO NOT EDIT THIS FILE' not in (rpi_boot_config_raw.content | b64decode)"
          - (rpi_boot_config_raw.content | b64decode | length) > 256
        fail_msg: >-
          {{ rpi_boot_config }} does not look like the config.txt the firmware
          reads — it carries the placeholder banner, or is implausibly small.
          Refusing to edit it. An overlay written to the wrong file is silently
          ignored, which is the exact bug this check exists to prevent.
      when: platform_type == "raspberrypi"
      tags: [raspberrypi, optimization, bluetooth]

    # Our own backup, not lineinfile's: Ansible names backups with colons, which
    # the vfat driver rejects, so backup:true fails outright on a boot partition.
    # force:false keeps the first backup of the day rather than overwriting it.
    - name: Back up config.txt before touching it
      ansible.builtin.copy:
        src: "{{ rpi_boot_config }}"
        dest: "{{ rpi_boot_config }}.bak-{{ ansible_date_time.date | replace('-', '') }}"
        remote_src: true
        force: false
        mode: preserve
      when:
        - platform_type == "raspberrypi"
        - disable_bluetooth | default(true)
      tags: [raspberrypi, optimization, bluetooth]

    - name: Disable Bluetooth overlay on Raspberry Pi
      ansible.builtin.lineinfile:
        path: "{{ rpi_boot_config }}"
        line: "dtoverlay=disable-bt"
        state: present
        create: false
      when:
        - platform_type == "raspberrypi"
        - disable_bluetooth | default(true)
      notify: "reboot_required"
      tags: [raspberrypi, optimization, bluetooth]

    # Verify rather than trust. A corrupted boot config does not announce itself
    # until the Pi fails to come back, and by then the fix is a screwdriver.
    - name: Re-read config.txt after the edit
      ansible.builtin.slurp:
        src: "{{ rpi_boot_config }}"
      register: rpi_boot_config_after
      when:
        - platform_type == "raspberrypi"
        - disable_bluetooth | default(true)
        - not ansible_check_mode
      tags: [raspberrypi, optimization, bluetooth]

    - name: Confirm config.txt is intact and the overlay landed exactly once
      ansible.builtin.assert:
        that:
          - (rpi_boot_config_after.content | b64decode).count('dtoverlay=disable-bt') == 1
          - (rpi_boot_config_after.content | b64decode | length) >= (rpi_boot_config_raw.content | b64decode | length)
          - "'DO NOT EDIT THIS FILE' not in (rpi_boot_config_after.content | b64decode)"
        fail_msg: >-
          {{ rpi_boot_config }} is not what it should be after the edit. A dated
          backup sits beside it — restore that BEFORE rebooting this host.
      when:
        - platform_type == "raspberrypi"
        - disable_bluetooth | default(true)
        - not ansible_check_mode
      tags: [raspberrypi, optimization, bluetooth]

    # Clean up what this task wrote to the wrong file for however long it was
    # pointed there. Guarded twice: only when the real config is somewhere else,
    # and only when the file still carries the placeholder banner. On Bullseye
    # /boot/config.txt IS the real config, and removing the overlay there would
    # quietly re-enable the radio.
    - name: Look for a placeholder /boot/config.txt
      ansible.builtin.slurp:
        src: /boot/config.txt
      register: rpi_boot_placeholder
      failed_when: false
      when:
        - platform_type == "raspberrypi"
        - rpi_boot_config | default('') != '/boot/config.txt'
      tags: [raspberrypi, optimization, bluetooth]

    - name: Remove the stale overlay from the placeholder /boot/config.txt
      ansible.builtin.lineinfile:
        path: /boot/config.txt
        regexp: '^dtoverlay=disable-bt\s*$'
        state: absent
        create: false
        backup: true
      when:
        - platform_type == "raspberrypi"
        - rpi_boot_config | default('') != '/boot/config.txt'
        - rpi_boot_placeholder.content is defined
        - "'DO NOT EDIT THIS FILE' in (rpi_boot_placeholder.content | b64decode)"
      tags: [raspberrypi, optimization, bluetooth]

    - name: Disable Bluetooth services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - hciuart.service
        - bluetooth.service
      ignore_errors: true
      when:
        - platform_type == "raspberrypi"
        - disable_bluetooth | default(true)
      tags: [raspberrypi, optimization, bluetooth]
      # Note: hciuart.service only exists on very old Pi/Raspbian versions
      # Modern systems won't have it - that's expected and OK

    - name: Create systemd service to disable HDMI on boot
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Disable HDMI to save power
          After=multi-user.target

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/vcgencmd display_power 0
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/disable-hdmi.service
        owner: root
        group: root
        mode: '0644'
      when:
        - platform_type == "raspberrypi"
        - disable_hdmi | default(true)
      register: hdmi_service
      tags: [raspberrypi, optimization, hdmi]

    - name: Reload systemd and restart disable-hdmi if changed
      ansible.builtin.systemd:
        name: disable-hdmi
        daemon_reload: true
        state: restarted
      when:
        - platform_type == "raspberrypi"
        - disable_hdmi | default(true)
        - hdmi_service is changed
      tags: [raspberrypi, optimization, hdmi]

    - name: Enable HDMI disable service
      ansible.builtin.systemd:
        name: disable-hdmi
        enabled: true
        daemon_reload: true
      when:
        - platform_type == "raspberrypi"
        - disable_hdmi | default(true)
      tags: [raspberrypi, optimization, hdmi]
