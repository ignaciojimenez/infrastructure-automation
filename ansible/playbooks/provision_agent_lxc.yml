---
# Provision the agent LXC (CT 103) on Proxmox
# Usage: ansible-playbook ansible/playbooks/provision_agent_lxc.yml
#
# The body lives in tasks/provision_lxc.yml and is shared with
# provision_workbench_lxc.yml. This file is the container's identity and
# nothing else — see that file for how provisioning works and why.

- name: Provision agent LXC on Proxmox
  hosts: proxmox_hosts
  become: true
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/all/vault.yml"

  vars:
    # Container identity — must match the agent-lxc entry in hosts.yml
    lxc_vmid: 103
    lxc_hostname: agent-lxc
    lxc_inventory_name: agent-lxc
    lxc_ip: 10.30.40.203
    lxc_cidr: 24
    lxc_gateway: 10.30.40.254
    lxc_nameserver: 10.30.40.254
    # Fleet hostnames resolve as <host>.local via Unbound on the gateway.
    # Without this searchdomain, `ssh cobra-agent` cannot resolve from inside
    # the container and the whole Tier 1 sweep fails.
    lxc_searchdomain: local
    lxc_bridge: vmbr0

    # Resources — 1 vCPU / 2GB / 16GB is sized for shell monitoring plus a
    # single-threaded agent runtime later (Phase B).
    lxc_cores: 1
    # 0 is Proxmox's default: no sustained-CPU cap. This container runs short
    # shell sweeps, not builds, so it has never needed one.
    lxc_cpulimit: 0
    lxc_memory: 2048
    lxc_swap: 512
    lxc_rootfs_size: 16
    lxc_storage: local-zfs

    # Template. Pinned deliberately: a fresh rebuild should reproduce a known
    # image, not silently pick up whatever is newest. Bump when Debian does.
    lxc_template_storage: local
    lxc_template: debian-13-standard_13.6-1_amd64.tar.zst

    # Minimum package set for Ansible to take over: sshd for transport,
    # python3 for modules, sudo for become.
    lxc_bootstrap_packages:
      - openssh-server
      - python3
      - sudo

  tasks:
    - name: Provision the container
      ansible.builtin.import_tasks: tasks/provision_lxc.yml
