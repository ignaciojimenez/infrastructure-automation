---
# Universal baseline configuration
# Applies to all hosts regardless of platform

- name: Apply universal baseline configuration
  hosts: all
  become: true
  vars:
    # Use variables from group_vars/all.yml or defaults
    _scripts_dir: "{{ scripts_dir | default('/home/' + primary_user + '/.scripts') }}"
    _config_dir: "{{ system_config_dir | default('/etc/monitoring') }}"
  tasks:
    - name: Set os_family if not defined (for standalone playbook execution)
      ansible.builtin.set_fact:
        os_family: "{{ ansible_os_family | lower }}"
      when: os_family is not defined
      tags: [always]

    - name: Ensure base directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: "{{ primary_user }}"
        group: "{{ primary_user }}"
      loop:
        - "{{ _scripts_dir }}"
        - "{{ _config_dir }}"
      tags: [baseline, directories]

    - name: Find all common scripts
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../../../scripts/common/"
        file_type: file
      register: common_scripts_baseline
      delegate_to: localhost
      become: false  # Don't sudo on control machine
      run_once: true
      tags: [baseline, scripts, monitoring]

    - name: Deploy all common scripts
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ _scripts_dir }}/{{ item.path | basename }}"
        mode: '0755'
        owner: "{{ primary_user }}"
        group: "{{ primary_user }}"
        backup: true
      loop: "{{ common_scripts_baseline.files }}"
      tags: [baseline, scripts, monitoring]

    - name: Install age encryption tool
      ansible.builtin.apt:
        name: age
        state: present
      become: true
      when: os_family == "debian"
      tags: [baseline, packages]

    - name: Configure cron PATH environment
      ansible.builtin.cron:
        name: PATH
        env: true
        job: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        user: "{{ primary_user }}"
      tags: [baseline, cron]

    - name: Deploy curlbin .netrc credentials
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../../templates/netrc_curlbin.j2"
        dest: "{{ home_dir }}/.netrc"
        owner: "{{ primary_user }}"
        group: "{{ primary_user }}"
        mode: '0600'
      when:
        - curlbin_user is defined
        - curlbin_user | length > 0
        - curlbin_password is defined
        - curlbin_password | length > 0
      tags: [baseline, backup, credentials]

    # `su` is not optional here, it is what keeps this working at all.
    # logrotate refuses to rotate anything whose parent directory is writable by
    # a group other than root, unless told which identity to rotate as — and
    # logs_dir is owned by the infrastructure user by design. On agent-lxc,
    # where the directory was created by hand (umask 002, so 0775), every user
    # log was skipped and logrotate.service failed every night from 2026-08-04
    # onward. Nobody noticed, because nothing checked failed units until now.
    #
    # Enforcing 0755 on the directory would also work, but only until the next
    # host whose logs_dir arrives by some other route. `su` removes the coupling
    # between two unrelated tasks instead of restating it.
    # 🔴 The glob is `*.log` and that is load-bearing, not incidental.
    # internet_speed_monitor and compare_speed_paths.sh deliberately write
    # speed_last.json, speed_history.csv and speed_ratio_history.csv into this
    # same directory precisely BECAUSE they are not `.log` and so survive here.
    # They hold the accumulating record a VPN-vs-direct ratio threshold gets set
    # from, which is a question asked over weeks — `rotate 7` plus `compress`
    # would leave one readable day of it. Widening this to `*` silently destroys
    # that data. If you need to rotate them, give them their own stanza with a
    # horizon that suits the question they answer.
    - name: Set up log rotation for user logs
      ansible.builtin.copy:
        dest: "/etc/logrotate.d/{{ primary_user }}"
        content: |
          {{ logs_dir }}/*.log {
              su {{ primary_user }} {{ infrastructure_group }}
              daily
              rotate 7
              compress
              delaycompress
              missingok
              notifempty
              create 0644 {{ primary_user }} {{ primary_user }}
          }
        owner: root
        group: root
        mode: '0644'
      when: os_family == "debian"
      tags: [baseline, logging]

- name: Install base software packages
  hosts: all
  become: true
  tasks:
    - name: Install base software
      ansible.builtin.import_tasks: ../tasks/install_base_software.yml
      when: os_family == "debian"
      tags: [packages, base]
