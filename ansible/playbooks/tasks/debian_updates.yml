---
# Debian Automatic Updates Configuration

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
  tags: [updates]

# ⚠️ This template is the ONLY thing that sets Automatic-Reboot,
# Automatic-Reboot-Time and Automatic-Reboot-WithUsers. Two `lineinfile` tasks
# used to sit further down this file claiming to do it; they were gated on
# `auto_reboot is defined`, which was never true anywhere in the inventory, so
# they had never run — and their regexps matched the *commented* stock lines,
# which this template does not emit. Defining the variable would therefore have
# made them live, found nothing to match, and appended a second, conflicting
# directive to a file the template had just written. Removed 2026-08-06, at the
# moment `auto_reboot` was defined for the first time.
- name: Configure unattended-upgrades
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../../templates/debian/50unattended-upgrades.j2"
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: '0644'
    backup: true
  tags: [updates, configuration]

- name: Enable automatic updates
  ansible.builtin.copy:
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
  tags: [updates, configuration]

- name: Create monitoring script for updates
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      # Check unattended-upgrades status

      if [ -f /var/log/unattended-upgrades/unattended-upgrades.log ]; then
          TODAY=$(date +%Y-%m-%d)
          if grep -q "$TODAY" /var/log/unattended-upgrades/unattended-upgrades.log; then
              echo "✅ Unattended upgrades ran today"
              exit 0
          else
              echo "⚠️  No unattended upgrades activity today"
              exit 1
          fi
      else
          echo "❌ Unattended upgrades log not found"
          exit 2
      fi
    dest: "{{ scripts_dir }}/check_auto_updates.sh"
    mode: '0755'
  tags: [updates, monitoring]
