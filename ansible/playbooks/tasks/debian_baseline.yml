---
# Debian Baseline Configuration Tasks

- name: Update package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: [packages]

- name: Install essential packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - htop
      - vim
      - jq
      - rsync
      - cron
      - sudo
      - python3-pip
      - iputils-ping
    state: present
  tags: [packages]

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone | default('Europe/Madrid') }}"
  register: timezone_set
  tags: [timezone]

# cron reads the timezone once at process start and never observes a later
# /etc/localtime change, so without this every job keeps firing at the old
# offset until something else restarts it. community.general.timezone does
# not do this for us — verified on cobra 2026-07-21, where cron was still
# running with the previous zone after the module reported "changed".
- name: Restart cron so it picks up the new timezone
  ansible.builtin.service:
    name: cron
    state: restarted
  when: timezone_set is changed
  tags: [timezone]

# The monitoring scripts run as this user under cron and read logs they do not
# own: /var/log/unattended-upgrades is root:adm 0750, and the journal is
# readable to `adm` without sudo. bootstrap.yml sets `groups: sudo` and nothing
# else, but only inside a block gated on connecting as root AND the user not
# existing — so on every live host that block never runs and the membership was
# never granted. cwwk, unifi-lxc and agent-lxc were measured missing it; the
# four Pis have it only by accident, inherited from the Pi image.
#
# This is the half that restores coverage: without it check_auto_upgrades can
# only report "cannot verify", which is honest but blind.
# Ghostty's terminfo is not in Debian's ncurses-term (checked on trixie, where
# ncurses-term is installed and does not carry it), so every interactive login
# from that terminal greets you with `tput: unknown terminal "xterm-ghostty"`
# and loses colour. Compiled per host rather than shipped as a binary
# terminfo: the compiled format is ncurses-version specific, the source is not.
#
# Installed system-wide rather than into one user's ~/.terminfo, because the
# accounts that get SSH'd into vary per host and this is a property of the
# host, not of an account.
- name: Stage the Ghostty terminfo source
  become: true
  ansible.builtin.copy:
    # Relative, so Ansible resolves it against this task file's own files/
    # directory. `{{ playbook_dir }}/files/` — the convention bootstrap.yml
    # uses — resolves to playbooks/platform/ here, because this file is
    # imported through platform/debian.yml rather than run directly.
    src: terminfo/xterm-ghostty.terminfo
    dest: /usr/local/share/xterm-ghostty.terminfo
    owner: root
    group: root
    mode: '0644'
  register: debian_ghostty_terminfo
  tags: [baseline, terminfo]

# `tic -x` reads the extended capabilities Ghostty relies on; without -x they
# are silently dropped. Guarded on `infocmp` rather than on the copy having
# changed, so a host that somehow lost the compiled entry gets it back.
- name: Check whether the Ghostty terminfo is compiled
  become: true
  ansible.builtin.command:
    cmd: infocmp -x xterm-ghostty
  register: debian_ghostty_compiled
  changed_when: false
  failed_when: false
  tags: [baseline, terminfo]

- name: Compile the Ghostty terminfo
  become: true
  ansible.builtin.command:
    cmd: tic -x -o /usr/share/terminfo /usr/local/share/xterm-ghostty.terminfo
  when: debian_ghostty_compiled.rc != 0 or debian_ghostty_terminfo.changed
  changed_when: true
  tags: [baseline, terminfo]

- name: Ensure the infrastructure user can read system logs
  ansible.builtin.user:
    name: "{{ infrastructure_user }}"
    groups: adm
    append: true
  tags: [users, groups, logs]

- name: Set ping capabilities for non-root users (LXC compatibility)
  ansible.builtin.command:
    cmd: setcap cap_net_raw+ep /bin/ping
  changed_when: false
  failed_when: false
  when: platform_type == "lxc"
  tags: [network, lxc]
