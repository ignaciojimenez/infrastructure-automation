---
# Deploy Monitoring Infrastructure - Cross-platform

# This half never created either directory at all. It installs a cron
# redirecting into logs_dir, writes a script into scripts_dir, and then prints
# "✅ Monitoring deployed" — on a host where neither exists, all three are true
# and none of them work. `system/preflight.yml` only asserts the *variable* is
# defined, which is satisfied by a path that was never made.
- name: Ensure the monitoring directories exist
  ansible.builtin.import_tasks: monitoring_dirs.yml

# ⚠️ `2-59/15` (02, 17, 32, 47) — deliberately OFF the :00 boundary.
#
# Scheduled maintenance in this fleet lands on :00, and this check samples
# service state in a single instant. On 2026-08-15 at 04:00 cobra reported
# `Service plexmediaserver: not running` because `backup_plex_config` does
# `systemctl stop plexmediaserver`, snapshots the config, and starts it ~22 s
# later — and this cron sampled the gap. Nothing was wrong with Plex.
#
# Verified across the fleet before choosing this fix, rather than assumed: only
# two hosts can collide, and both are on the :00 boundary.
#
#   cobra   `0 4 */7 * *` backup_plex  → stops plexmediaserver ~22 s
#   hifipi  `@weekly` restart_audio    → restarts mpd/shairport-sync/raspotify
#
#   unifi-lxc and cwwk are clear — backup_unifi.sh and backup_proxmox_config.sh
#   contain no `systemctl` at all, so their backups never touch service state.
#
# Both hosts became exposed only on 2026-08-13, when `critical_services` was
# first declared per host: before that this check probed `ssh cron fail2ban`
# and never looked at Plex or the audio stack. Closing that gap is what created
# the false positive.
#
# The cron `name:` is unchanged on purpose — the Ansible cron module keys on it,
# so this updates the existing entry in place. Changing the name would leave the
# old `*/15` line behind and run the check twice.
#
# 📌 This is mitigation, not the fix. It moves the sample away from the known
# maintenance windows; it does not make the check able to tell a restart from an
# outage. That is the retry in `check_services` — see docs/TODO.md D6.
- name: Set up monitoring cron jobs (Debian/Linux)
  ansible.builtin.cron:
    name: "System health check"
    minute: "{{ monitoring_interval | default('2-59/15') }}"
    job: >
      {{ scripts_dir }}/enhanced_monitoring_wrapper
      --heartbeat-interval=daily
      --notify-fixed=true
      {{ logging_token }}
      {{ alert_token }}
      {{ scripts_dir }}/system_health_check.sh
      >> {{ logs_dir }}/system_health_check.log 2>&1
    user: "{{ primary_user }}"
  when:
    - os_family == "debian"
    - logging_token is defined
    - alert_token is defined
  tags: [monitoring, cron]
  # Note: disk_usage.sh and memory_check.sh are NOT scheduled separately
  # as system_health_check.sh already includes disk and memory checks
  # System health check is deployed to ALL hosts, including network_controller

# FreeBSD deliberately has no equivalent of the cron above. `roles/platform/
# opnsense` already schedules eight wrapped checks, including its own
# `check_system_health.sh`, which covers memory, disk and load with FreeBSD-
# native probes — where the common script's FreeBSD memory branch measures
# nothing at all. Scheduling both would duplicate three checks at two different
# sets of thresholds.
#
# The two entries that used to live here were removed 2026-08-06 after reading
# the live crontab, which had neither. One ran the common script *unwrapped*,
# so a failure would have gone to local mail rather than Slack; the other
# pointed at `check_pf_status.sh`, which has never existed in this repo — a
# cron installed against a missing script, which is precisely the silent-
# failure shape this sprint exists to remove.
#
# `state: absent` rather than deletion alone: any host that ever received them
# gets cleaned on the next run.
- name: Remove monitoring cron jobs that belong to the OPNsense role (FreeBSD)
  ansible.builtin.cron:
    name: "{{ item }}"
    state: absent
    user: "{{ primary_user }}"
  loop:
    - "System health check"
    - "Firewall status check"
  when: os_family == "freebsd"
  tags: [monitoring, cron]

- name: Create monitoring aggregation script
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      # Aggregate monitoring results
      # Note: system_health_check.sh includes disk and memory checks

      MONITORING_DIR="{{ system_config_dir | default('/etc/monitoring') }}/results"
      mkdir -p "$MONITORING_DIR"

      # Run comprehensive health check (includes disk, memory, load, services, network)
      echo "=== System Health Check ===" > "$MONITORING_DIR/latest.txt"
      {{ scripts_dir }}/system_health_check.sh >> "$MONITORING_DIR/latest.txt" 2>&1

      # Keep historical data
      cp "$MONITORING_DIR/latest.txt" "$MONITORING_DIR/$(date +%Y%m%d_%H%M%S).txt"

      # Clean old files (keep 7 days)
      find "$MONITORING_DIR" -name "*.txt" -mtime +7 -delete
    dest: "{{ scripts_dir }}/run_all_monitoring.sh"
    mode: '0755'
  tags: [monitoring, scripts]

- name: Test monitoring script execution
  ansible.builtin.command:
    cmd: "{{ scripts_dir }}/system_health_check.sh --version"
  register: monitoring_test
  failed_when: false
  changed_when: false
  tags: [monitoring, validation]

- name: Report monitoring deployment status
  ansible.builtin.debug:
    msg: |
      ✅ Monitoring deployed to {{ inventory_hostname }}
      Scripts directory: {{ scripts_dir }}
      Config directory: {{ system_config_dir | default('/etc/monitoring') }}
      Monitoring interval: {{ monitoring_interval | default('*/15') }}
  tags: [monitoring, validation]
