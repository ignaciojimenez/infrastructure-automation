---
# SSH Hardening - Migrated from raspberrypi-ansible

# The GitHub key set, exclusive, for the account Ansible connects as. Shared
# with bootstrap.yml so the two cannot drift again — see the file.
- name: Set authorized keys from GitHub
  ansible.builtin.import_tasks: github_authorized_keys.yml
  vars:
    github_keys_user: "{{ ansible_user }}"

- name: Create authorized key command script
  become: true
  ansible.builtin.copy:
    dest: "/usr/local/bin/update_keys"
    owner: root
    mode: "755"
    content: |
      #!/bin/sh
      curl -sf "{{ gh_keys }}"
  when: gh_keys is defined
  tags: [ssh, keys]

- name: Deploy hardened sshd config
  become: true
  ansible.builtin.template:
    backup: true
    src: "{{ playbook_dir }}/../../templates/debian/sshd_config.j2"
    dest: "/etc/ssh/sshd_config"
    mode: '0600'
    owner: root
    group: root
    validate: 'sshd -t -f %s'
  when: os_family == "debian"
  notify: restart_ssh
  vars:
    update_key_script: "/usr/local/bin/update_keys"
  tags: [ssh, configuration]

- name: Disable root user login
  become: true
  ansible.builtin.user:
    name: root
    state: present
    password_lock: true
    # On FreeBSD (opnsense) root's shell is /usr/local/sbin/opnsense-shell — the
    # console admin menu on VGA/serial. Replacing it with nologin would remove
    # the console recovery path, so only lock the password there.
    shell: "{{ '/sbin/nologin' if os_family == 'debian' else omit }}"
  # No longer skipped on test containers (2026-10-03). The skip kept root SSH
  # as the rig's "second way in", but bootstrap.yml already gave root nologin
  # there, so it protected nothing — and it left root-disabling as the one part
  # of hardening the rig never exercised. The rig is reached as the
  # infrastructure user and recreated per run.
  when: ansible_user != "root"
  tags: [ssh, security]

# Root takes no SSH keys. PermitRootLogin is no and root's shell is nologin, so
# a key here grants nothing today — it waits for one of those to slip. These
# are the GitHub keys bootstrap.yml wrote to root by mistake until 2026-10-03
# (TODO 3b). Own tag so it can run without the GitHub key write above.
#
# Skipped when connected as root: that is a bare test container, and its key is
# the way in.
- name: Remove root's authorized_keys
  become: true
  ansible.builtin.file:
    path: /root/.ssh/authorized_keys
    state: absent
  when:
    - os_family == "debian"
    - platform_type | default('') != "proxmox"
    - ansible_user != "root"
  tags: [ssh, security, root_keys]

# Proxmox is the exception, because it owns root's keys. /root/.ssh/authorized_keys
# is a symlink into the cluster filesystem, and `pvecm updatecerts` — run on
# every pveproxy start — restores that link and MERGES any plain file it finds
# there into the shared one (PVE/Cluster/Setup.pm, setup_ssh_keys and
# ssh_merge_keys). Deleting root's file would only last until the next boot,
# when the GitHub keys already in the shared file came back with it.
#
# So: the shared file holds the node's own root key and nothing else, and the
# link is put back. Bootstrap's exclusive write had replaced it with a plain
# file on 2026-09-25.
- name: Read the hypervisor's own root key
  become: true
  ansible.builtin.slurp:
    src: /root/.ssh/id_rsa.pub
  register: proxmox_root_pubkey
  when: platform_type | default('') == "proxmox"
  tags: [ssh, security, root_keys]

# `copy` with the ownership pmxcfs itself enforces, not `authorized_key`: that
# module chowns to root:root after writing, pmxcfs refuses it (EPERM), and the
# task failed with the content already replaced — forced on cwwk 2026-10-04.
- name: Limit Proxmox's root keys to the node's own key
  become: true
  ansible.builtin.copy:
    dest: /etc/pve/priv/authorized_keys
    content: "{{ proxmox_root_pubkey.content | b64decode | trim }}\n"
    owner: root
    group: www-data
    mode: '0600'
  when: platform_type | default('') == "proxmox"
  tags: [ssh, security, root_keys]

- name: Restore Proxmox's root keys symlink
  become: true
  ansible.builtin.file:
    src: /etc/pve/priv/authorized_keys
    dest: /root/.ssh/authorized_keys
    state: link
    force: true
  when: platform_type | default('') == "proxmox"
  tags: [ssh, security, root_keys]

- name: Lock the user account password
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    password_lock: true
  # Was `inventory_hostname not in ['devpi']` — the right intent keyed to a host
  # that was never in the fleet inventory and has not been used in a long time.
  # Generalised to the flag the test inventory sets. See docs/TODO.md for the
  # devpi decision.
  when: not (is_test_environment | default(false))
  tags: [ssh, security]

- name: Allow only specific users (optional)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?AllowUsers'
    line: "AllowUsers {{ ssh_allowed_users | default(infrastructure_user) }}"
    state: present
    validate: 'sshd -t -f %s'
  when: ssh_allowed_users is defined
  notify: restart_ssh
  tags: [ssh, configuration]

- name: Ensure SSH service is enabled and running
  ansible.builtin.systemd:
    name: "{{ 'ssh' if os_family == 'debian' else 'sshd' }}"
    state: started
    enabled: true
  when: os_family == 'debian'
  tags: [ssh, service]

# Fourth instance of the same omission, and the only one that fails loudly:
# `copy` into a missing scripts_dir aborts the play with "Destination directory
# does not exist", which is how it was found on 2026-08-04 against a container
# whose ~/.scripts had been reset away.
- name: Ensure the monitoring directories exist
  ansible.builtin.import_tasks: monitoring_dirs.yml

- name: Create SSH monitoring script
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      # Monitor SSH failed login attempts

      LOG_FILE="/var/log/auth.log"
      if [ -f "/var/log/secure" ]; then
          LOG_FILE="/var/log/secure"
      fi

      # Check for failed SSH attempts in the last hour
      FAILED=$(grep "Failed password" "$LOG_FILE" 2>/dev/null | \
               grep "$(date '+%b %e %H')" | \
               wc -l)

      if [ "$FAILED" -gt 10 ]; then
          echo "❌ Warning: $FAILED failed SSH attempts in the last hour"
          exit 1
      elif [ "$FAILED" -gt 0 ]; then
          echo "⚠️  $FAILED failed SSH attempts in the last hour"
          exit 0
      else
          echo "✅ No failed SSH attempts"
          exit 0
      fi
    dest: "{{ scripts_dir }}/check_ssh_security.sh"
    mode: '0755'
  tags: [ssh, monitoring]
