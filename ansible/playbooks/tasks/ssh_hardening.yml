---
# SSH Hardening - Migrated from raspberrypi-ansible

# The GitHub key set, exclusive, for the account Ansible connects as. Shared
# with bootstrap.yml so the two cannot drift again — see the file.
- name: Set authorized keys from GitHub
  ansible.builtin.import_tasks: github_authorized_keys.yml
  vars:
    github_keys_user: "{{ ansible_user }}"

- name: Create authorized key command script
  become: true
  ansible.builtin.copy:
    dest: "/usr/local/bin/update_keys"
    owner: root
    mode: "755"
    content: |
      #!/bin/sh
      curl -sf "{{ gh_keys }}"
  when: gh_keys is defined
  tags: [ssh, keys]

- name: Deploy hardened sshd config
  become: true
  ansible.builtin.template:
    backup: true
    src: "{{ playbook_dir }}/../../templates/debian/sshd_config.j2"
    dest: "/etc/ssh/sshd_config"
    mode: '0600'
    owner: root
    group: root
    validate: 'sshd -t -f %s'
  when: os_family == "debian"
  notify: restart_ssh
  vars:
    update_key_script: "/usr/local/bin/update_keys"
  tags: [ssh, configuration]

- name: Disable root user login
  become: true
  ansible.builtin.user:
    name: root
    state: present
    password_lock: true
    # On FreeBSD (opnsense) root's shell is /usr/local/sbin/opnsense-shell — the
    # console admin menu on VGA/serial. Replacing it with nologin would remove
    # the console recovery path, so only lock the password there.
    shell: "{{ '/sbin/nologin' if os_family == 'debian' else omit }}"
  # Skipped on a test container so root SSH survives as a second way in. It
  # means root-disabling itself is the one part of hardening the rig does not
  # exercise — an accepted trade, because the alternative is a single point of
  # access on a host only `pct` can rescue.
  when:
    - ansible_user != "root"
    - not (is_test_environment | default(false))
  tags: [ssh, security]

- name: Lock the user account password
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    password_lock: true
  # Was `inventory_hostname not in ['devpi']` — the right intent keyed to a host
  # that was never in the fleet inventory and has not been used in a long time.
  # Generalised to the flag the test inventory sets. See docs/TODO.md for the
  # devpi decision.
  when: not (is_test_environment | default(false))
  tags: [ssh, security]

- name: Allow only specific users (optional)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?AllowUsers'
    line: "AllowUsers {{ ssh_allowed_users | default(infrastructure_user) }}"
    state: present
    validate: 'sshd -t -f %s'
  when: ssh_allowed_users is defined
  notify: restart_ssh
  tags: [ssh, configuration]

- name: Ensure SSH service is enabled and running
  ansible.builtin.systemd:
    name: "{{ 'ssh' if os_family == 'debian' else 'sshd' }}"
    state: started
    enabled: true
  when: os_family == 'debian'
  tags: [ssh, service]

# Fourth instance of the same omission, and the only one that fails loudly:
# `copy` into a missing scripts_dir aborts the play with "Destination directory
# does not exist", which is how it was found on 2026-08-04 against a container
# whose ~/.scripts had been reset away.
- name: Ensure the monitoring directories exist
  ansible.builtin.import_tasks: monitoring_dirs.yml

- name: Create SSH monitoring script
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      # Monitor SSH failed login attempts

      LOG_FILE="/var/log/auth.log"
      if [ -f "/var/log/secure" ]; then
          LOG_FILE="/var/log/secure"
      fi

      # Check for failed SSH attempts in the last hour
      FAILED=$(grep "Failed password" "$LOG_FILE" 2>/dev/null | \
               grep "$(date '+%b %e %H')" | \
               wc -l)

      if [ "$FAILED" -gt 10 ]; then
          echo "❌ Warning: $FAILED failed SSH attempts in the last hour"
          exit 1
      elif [ "$FAILED" -gt 0 ]; then
          echo "⚠️  $FAILED failed SSH attempts in the last hour"
          exit 0
      else
          echo "✅ No failed SSH attempts"
          exit 0
      fi
    dest: "{{ scripts_dir }}/check_ssh_security.sh"
    mode: '0755'
  tags: [ssh, monitoring]
