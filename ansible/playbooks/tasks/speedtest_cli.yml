---
# Ookla Speedtest CLI — the binary `internet_speed_monitor` measures with.
#
# Why this file exists: the binary was hand-installed on dockassist and nothing
# in this repo put it there. Rebuild that host and `internet_speed_monitor`
# exits 2 with "Speedtest command failed or not available" — the check goes
# quiet without ever alerting. See docs/TODO.md item 1c.
#
# ⚠️ The name `speedtest` is ambiguous, which is the worse half of the problem.
# Debian's `speedtest-cli` package (Python, unrelated project) also ships
# /usr/bin/speedtest, prints plausible Mbps, and takes DIFFERENT flags — it has
# no --format=json and no --server-id. A host that has it produces numbers that
# look fine and are not comparable with Ookla's. So this file does not just
# install the right thing, it PURGES the impostor first; and
# internet_speed_monitor separately asserts at runtime that the binary it found
# really is Ookla's, because an install-time fix cannot protect a host someone
# later runs `apt install speedtest-cli` on.
#
# Shared rather than role-local because item 1d needs the same binary on a
# VLAN 40 host to measure the VPN path, and that host is not a Home Assistant
# host.

- name: Ensure apt keyring directory exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
    owner: root
    group: root
  tags: [monitoring, network, speedtest]

# Debian's speedtest-cli and Ookla's speedtest both ship /usr/bin/speedtest, so
# apt would refuse the install with a file conflict even if we did not care
# which one won. Purge before adding the repo, not after.
- name: Remove Debian speedtest-cli (conflicts with Ookla's /usr/bin/speedtest)
  become: true
  ansible.builtin.apt:
    name: speedtest-cli
    state: absent
    purge: true
  tags: [monitoring, network, speedtest]

- name: Download Ookla signing key (ASCII-armored)
  become: true
  ansible.builtin.get_url:
    url: https://packagecloud.io/ookla/speedtest-cli/gpgkey
    dest: /tmp/ookla_speedtest-cli.asc
    force: true
    mode: '0644'
  tags: [monitoring, network, speedtest]

# Dearmor to a temp path and then `copy` it into place, rather than dearmoring
# straight to the keyring when the download reports `changed`. The download is
# `force: true` so it reports changed on content, not on absence — which means
# a keyring someone deleted would never be regenerated if the dearmor were
# gated on it. Comparing the dearmored bytes is what makes this both correct
# and idempotent.
- name: Dearmor Ookla signing key
  become: true
  ansible.builtin.command:
    cmd: gpg --yes --dearmor -o /tmp/ookla_speedtest-cli.gpg /tmp/ookla_speedtest-cli.asc
  changed_when: false
  tags: [monitoring, network, speedtest]

- name: Install Ookla signing keyring
  become: true
  ansible.builtin.copy:
    src: /tmp/ookla_speedtest-cli.gpg
    dest: /etc/apt/keyrings/ookla_speedtest-cli-archive-keyring.gpg
    remote_src: true
    owner: root
    group: root
    mode: '0644'
  tags: [monitoring, network, speedtest]

# `{{ ansible_distribution_release }}` rather than a pinned codename: dockassist
# is bookworm and the VLAN 40 container is trixie, and packagecloud serves both
# (verified 2026-09-05 against dists/<suite>/Release, with a bogus suite
# returning 404 as the control, and `speedtest` present in main/binary-amd64
# and main/binary-arm64 for trixie).
- name: Add Ookla speedtest repository
  become: true
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/ookla_speedtest-cli-archive-keyring.gpg]
      https://packagecloud.io/ookla/speedtest-cli/debian/
      {{ ansible_distribution_release }} main
    filename: ookla_speedtest-cli
    state: present
    update_cache: true
  tags: [monitoring, network, speedtest]

- name: Install Ookla speedtest
  become: true
  ansible.builtin.apt:
    name: speedtest
    state: present
    force_apt_get: true
  tags: [monitoring, network, speedtest]

# Installing the right package is not the same as the right binary answering to
# the name. Prove it on the host rather than assuming the purge above was
# enough — this is the check that would have caught the ambiguity in the first
# place.
- name: Verify /usr/bin/speedtest is Ookla's
  ansible.builtin.command:
    cmd: speedtest --version
  register: speedtest_version
  changed_when: false
  failed_when: >-
    speedtest_version.rc != 0
    or 'Speedtest by Ookla' not in speedtest_version.stdout
  tags: [monitoring, network, speedtest]
