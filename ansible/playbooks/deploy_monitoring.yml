---
# Deploy monitoring scripts to all hosts
# Includes common scripts and platform-specific monitoring
# Usage: ansible-playbook ansible/playbooks/deploy_monitoring.yml

- name: Deploy common monitoring scripts
  hosts: all
  become: true
  vars:
    # opnsense keeps local configuration under /usr/local/etc; anything the
    # firewall does not own under /etc there is liable to be regenerated.
    monitoring_config_dir: "{{ '/usr/local/etc/monitoring' if os_family == 'freebsd' else '/etc/monitoring' }}"
  tasks:
    - name: Ensure base scripts directory exists
      ansible.builtin.file:
        path: "{{ scripts_dir }}"
        state: directory
        owner: "{{ infrastructure_user }}"
        group: "{{ infrastructure_group }}"
        mode: '0755'
      tags: [monitoring, scripts]

    - name: Ensure logs directory exists
      ansible.builtin.file:
        path: "{{ logs_dir }}"
        state: directory
        owner: "{{ infrastructure_user }}"
        group: "{{ infrastructure_group }}"
        mode: '0755'
      tags: [monitoring, logs]

    - name: Find all scripts in common directory
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../../scripts/common/"
        file_type: file
      register: common_scripts
      delegate_to: localhost
      become: false  # Don't sudo on control machine
      run_once: true
      tags: [monitoring, scripts]

    # `system_health_check.sh` is excluded on FreeBSD: the OPNsense role
    # schedules its own `check_system_health.sh`, wrapped and alerting, with
    # FreeBSD-native memory probing that the common script does not have.
    # Shipping a second, unscheduled health check to the firewall is dead
    # weight that reads as coverage — it sat in /usr/local/bin uninvoked until
    # 2026-08-06, when reading the live crontab showed nothing ran it.
    - name: Deploy all common scripts
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ scripts_dir }}/{{ item.path | basename }}"
        mode: '0755'
        owner: "{{ infrastructure_user }}"
        group: "{{ infrastructure_group }}"
      loop: "{{ common_scripts.files }}"
      when: not (os_family == "freebsd" and item.path | basename == "system_health_check.sh")
      register: common_scripts_deployed
      tags: [monitoring, scripts]

    - name: Remove the common health check from FreeBSD hosts
      ansible.builtin.file:
        path: "{{ scripts_dir }}/system_health_check.sh"
        state: absent
      when: os_family == "freebsd"
      tags: [monitoring, scripts]

    # The critical-service list is inventory-driven, because a host that calls
    # a service something else should say so in inventory rather than in a
    # script shipped to all seven — opnsense's ssh rc script is `openssh`, and
    # renaming `sshd` in the script would fix this fleet while breaking stock
    # FreeBSD. system_health_check.sh keeps a working built-in default, so a
    # host with no config file behaves exactly as it does today.
    - name: Ensure monitoring config directory exists
      ansible.builtin.file:
        path: "{{ monitoring_config_dir }}"
        state: directory
        mode: '0755'
      tags: [monitoring, scripts, config]

    - name: Deploy the critical-service list where inventory defines one
      ansible.builtin.copy:
        dest: "{{ monitoring_config_dir }}/health_check.conf"
        content: |
          # Managed by ansible/playbooks/deploy_monitoring.yml — do not edit here.
          # Sourced by system_health_check.sh: the services whose absence is a
          # fault on this host, named as this host's init system names them.
          CRITICAL_SERVICES="{{ critical_services | join(' ') }}"
        mode: '0644'
      when: critical_services is defined
      tags: [monitoring, scripts, config]

    # A host dropped from the inventory var must fall back to the built-in
    # default rather than keeping whatever it was last told.
    - name: Remove the critical-service list where inventory defines none
      ansible.builtin.file:
        path: "{{ monitoring_config_dir }}/health_check.conf"
        state: absent
      when: critical_services is not defined
      tags: [monitoring, scripts, config]

    # Only restart when something was actually deployed. This previously ran
    # unconditionally, which made the whole playbook permanently report
    # changed=1 per host (masking real diffs) and needlessly bounced cron on
    # every run. See docs/TODO.md — the restart may be unnecessary altogether,
    # since cron re-reads changed crontabs on its own.
    - name: Restart monitoring services if needed
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - cron
      when:
        - ansible_service_mgr == "systemd"
        - common_scripts_deployed is changed
      failed_when: false
      tags: [monitoring, services]

    - name: Report common scripts deployment complete
      ansible.builtin.debug:
        msg: "✅ Common monitoring scripts deployed to {{ inventory_hostname }}"

# Deploy platform-specific monitoring
- name: Deploy Proxmox monitoring
  hosts: proxmox_hosts
  become: true
  roles:
    - role: platform/proxmox
  tags: [monitoring, proxmox]

- name: Deploy OPNsense monitoring
  hosts: freebsd_hosts
  become: true
  roles:
    - role: platform/opnsense
  tags: [monitoring, opnsense]

# SMART disk-health — self-gated on enable_smart_monitoring (cwwk + cobra only)
- name: Deploy SMART disk-health monitoring
  ansible.builtin.import_playbook: system/smart_monitoring.yml
