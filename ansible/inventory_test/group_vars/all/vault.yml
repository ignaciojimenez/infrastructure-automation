# FAKE vault for the test rig. Contains NOTHING real.
#
# Deliberately unencrypted: the point is that converging a throwaway container
# needs no access to the fleet's secrets. Proven 2026-09-21 — bootstrap.yml and
# a full site.yml both reach failed=0 against CT 199 with only fakes here.
#
# 🔴 Shape-matched, not merely dead. A fake still has to survive every validator
# on the path it travels. enhanced_monitoring_wrapper checks its webhook against
# T[A-Z0-9]*/B[A-Z0-9]*/[a-zA-Z0-9]* and exits with a usage error before running
# the checked script, so the previous TEST/TEST/... tokens meant nothing
# downstream of that gate was ever exercised on the rig (docs/TODO.md item 43).
# Keep the character classes of the real values: slashes, dots, +, = and all.
#
# vault_infrastructure_user is pinned REAL and pinned deliberately. The fleet
# vault does not define it at all, so group_vars/all/main.yml falls back to
# `lookup('env', 'USER')` — which is `choco` on the laptop and `builder` on the
# workbench. Leaving it to the fallback means the rig works from one machine and
# fails at SSH from the other, with an error that names the wrong account rather
# than the wrong assumption. It is a username, not a credential.

