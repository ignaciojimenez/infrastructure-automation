---
# Test inventory — the disposable containers on cwwk, and nothing else.
#
#   ansible-playbook -i ansible/inventory_test/hosts.yml \
#       ansible/playbooks/deploy_monitoring.yml
#   tests/sandbox.sh --shell            # poke at one by hand
#
# These hosts are created and destroyed by tests/provision_test_container.sh;
# every value here mirrors that script's defaults. Keep the two in step.
# See docs/TEST_CONTAINER.md for what each container is a proxy for, and what
# it is NOT a proxy for.
#
# ⚠️ Do not add a fleet host to this file. `is_test_environment` unlocks
# behaviour that must never reach production — hardening keeps the rig's key
# alongside GitHub's, and the Slack tokens are dead.
#
# ------------------------------------------------------------------
# Connection: as the infrastructure user over sudo, exactly as the fleet is
# reached, using the control machine's passphrase-free rig key (rig_ssh_key,
# below). Connecting as root instead would make `become` a no-op — every
# privilege-escalation path in every playbook would go untested — and would
# drag scripts_dir and logs_dir to /home/root, because they derive from
# ansible_user. IdentityAgent=none keeps
# Secretive and its Touch ID prompt out, so runs stay unattended.
#
# For the bootstrap user-creation path you want the opposite: a container built
# with TEST_CT_BARE=1 and `-e ansible_user=root`, which is the only state where
# that branch of bootstrap.yml runs.
#
# Why every override sits at host level: group_vars/all/main.yml is inventory
# group_vars, precedence 4, and overrides anything a group defined *inside* an
# inventory file sets (precedence 3). Host vars are precedence 8 and win.
# Moving any of these up to `debian_hosts.vars` silently reverts it to the
# fleet value — verify with
#   ansible -i ansible/inventory_test/hosts.yml all -m debug -a 'msg={{ scripts_dir }}'
# ------------------------------------------------------------------

all:
  children:
    debian_hosts:
      vars:
        os_family: debian
        package_manager: apt
        service_manager: systemd
        ansible_python_interpreter: /usr/bin/python3
        infrastructure_group: "{{ infrastructure_user }}"

        # The key the rig connects with, resolved per CONTROL MACHINE rather
        # than written as a path. The workbench holds rig_runner_ed25519 (its
        # private half is generated there by provision_rig_access.yml and never
        # leaves); the laptop holds read_agent_ed25519. Neither exists on the
        # other box, so first-found picks the right one without a flag. A
        # literal laptop path here is what stopped the loop running anywhere
        # else.
        #
        # Safe as a group var: group_vars/all/main.yml does not define it, so
        # nothing at higher precedence can shadow it (see the note above).
        rig_ssh_key: >-
          {{ lookup('ansible.builtin.first_found', [
               lookup('ansible.builtin.env', 'HOME') ~ '/.ssh/rig_runner_ed25519',
               lookup('ansible.builtin.env', 'HOME') ~ '/.ssh/read_agent_ed25519']) }}

        # Read from the key's own .pub, not restated. ssh_hardening asserts this
        # key survives its `exclusive: true` write; a literal would assert the
        # laptop's key while the workbench connected with another, and the
        # hardening pass would then lock the rig out of the container.
        test_environment_ssh_key: "{{ lookup('ansible.builtin.file', rig_ssh_key ~ '.pub') }}"

      children:
        lxc_containers:
          vars:
            platform_type: lxc
          hosts:
            # CT 199 — Debian 13. Twin of agent-lxc and unifi-lxc; close to cwwk.
            testlxc:
              ansible_host: 10.30.40.205
              container_id: 199

              ansible_user: "{{ infrastructure_user }}"
              ansible_ssh_private_key_file: "{{ rig_ssh_key }}"
              ansible_ssh_common_args: >-
                -o ConnectTimeout=5
                -o IdentitiesOnly=yes
                -o IdentityAgent=none
                -o StrictHostKeyChecking=accept-new

              # Skips hardware-dependent tasks, and tells ssh_hardening it is
              # allowed to keep a spare key rather than locking the rig out.
              is_test_environment: true

              # test_environment_ssh_key (the key ssh_hardening must keep) is
              # derived from rig_ssh_key under debian_hosts.vars above.

              # Deliberately unmatched: no roles/services/test/ and no
              # group_vars/test.yml exist, so services.yml deploys the
              # monitoring play and nothing else. Point it at a real function to
              # exercise that role.
              #
              # It used to be mandatory here for the wrong reason —
              # services.yml compared `primary_function` with no guard and
              # errored out on a host that omitted it. Fixed 2026-08-06 (every
              # comparison now carries `| default("")`), so omitting this is
              # once again a way to test the no-function path rather than a way
              # to abort the run.
              primary_function: test

              # Webhook tokens are NOT overridden here any more. They come from
              # this inventory's own group_vars/all/vault.yml, which holds
              # nothing real — so a container still cannot post into
              # #home-logging or #home-alerts, and the guarantee now lives in
              # one place instead of being restated per host.
              #
              # The old values were `TEST/TEST/...`, which were dead but the
              # wrong SHAPE: enhanced_monitoring_wrapper validates its webhook
              # against T[A-Z0-9]*/B[A-Z0-9]*/[a-zA-Z0-9]* and exited with a
              # usage error before running the checked script, so nothing
              # downstream of that gate was ever exercised here. See
              # docs/TODO.md item 43.

            # CT 198 — Debian 12. Proxy for the four Raspberry Pis on the axis
            # that matters to a POSIX shell script: OS release, not CPU.
            test-deb12:
              ansible_host: 10.30.40.206
              container_id: 198

              ansible_user: "{{ infrastructure_user }}"
              ansible_ssh_private_key_file: "{{ rig_ssh_key }}"
              ansible_ssh_common_args: >-
                -o ConnectTimeout=5
                -o IdentitiesOnly=yes
                -o IdentityAgent=none
                -o StrictHostKeyChecking=accept-new

              is_test_environment: true
              primary_function: test
