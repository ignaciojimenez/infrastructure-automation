---
name: Ansible Lint

on:
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - "scripts/**"
      # templates/ holds sshd_config.j2 and friends. The Jinja syntax check
      # below already globs them, but without this a templates-only change
      # never triggered the workflow that checks it.
      - "templates/**"
      - "tests/**"
      - ".ansible-lint"
      - ".github/workflows/ansible-lint.yml"
  pull_request:
    paths:
      - "ansible/**"
      - "scripts/**"
      # templates/ holds sshd_config.j2 and friends. The Jinja syntax check
      # below already globs them, but without this a templates-only change
      # never triggered the workflow that checks it.
      - "templates/**"
      - "tests/**"
      - ".ansible-lint"
      - ".github/workflows/ansible-lint.yml"

# The GITHUB_TOKEN is scoped down here rather than left at the repository
# default. This workflow only lints — it never pushes, commits, or calls the
# API — so read is all it can justify, and an explicit block means a change to
# the repo-wide default cannot silently widen it.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — checkout otherwise writes the token
      # into .git/config, where every later step in the job can read it.
      # Nothing here pushes, so the credential has no purpose after the
      # clone; leaving it behind only widens what a compromised action or
      # dependency could reach. Complements the permissions block above:
      # that limits what the token CAN do, this limits what can reach it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ansible, ansible-lint and shellcheck at the newest versions public for
      # 20+ days: the same script and cooldown the workbench's builder installs
      # with, so the two land on the same versions (PER-159). The `ansible`
      # package carries the collections ansible-lint resolves. The token only
      # lifts the GitHub API rate limit for the shellcheck release lookup.
      - name: Install lint tools (20-day cooldown)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sh scripts/ci/install_lint_tools.sh "$RUNNER_TEMP/lint-tools"
          echo "$RUNNER_TEMP/lint-tools/current/bin" >> "$GITHUB_PATH"

      # One script, shared with the unattended builder, so the two can never
      # disagree about what "lint-clean" means (PER-159). It lints the git
      # index in a temporary copy set up like this checkout used to be:
      # example inventory, dummy vault. Read it for the steps and their whys.
      - name: Lint (scripts/ci/lint.sh)
        run: sh scripts/ci/lint.sh

      # Last step on purpose: everything above must have had its chance to fail.
      #
      # Why this exists at all — CI caught the shellcheck fault on all 22 pushes
      # between 18 and 29 Aug and emailed every one, and those emails arrived.
      # Nothing went undetected and nothing went unsent; the repo stayed broken
      # for eleven days purely because email is not a channel that produces
      # action here. #home-alerts is. See docs/TODO.md item 25.
      #
      # Gated to failures on a push to main, and nothing else. A red branch is
      # the author's problem while they are already watching it; a red main is
      # the thing that went unnoticed. Alerting on both would turn the one
      # watched channel into a second #home-logging, which is the exact failure
      # being fixed here.
      # Quoted: an unquoted " #" opens a YAML comment, which silently truncated
      # this name to "Alert" and left the rest as a comment ansible-lint rejected.
      - name: "Alert #home-alerts when main goes red"
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Read through env, never interpolated into the script below: a commit
          # message is untrusted input and ${{ }} inside `run` is shell injection.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "SLACK_ALERT_WEBHOOK is not set, so this failure was not announced."
            echo "Set it with: gh secret set SLACK_ALERT_WEBHOOK"
            exit 1
          fi
          short_sha=$(printf '%s' "$COMMIT_SHA" | cut -c1-7)
          subject=$(printf '%s' "$COMMIT_MSG" | head -1)
          # jq builds the payload so quotes or newlines in a commit subject
          # cannot break out of the JSON string.
          jq -n --arg sha "$short_sha" --arg subject "$subject" --arg url "$RUN_URL" \
            '{text: ("🔴 *CI red on main* — infrastructure-automation\n`" + $sha + "` " + $subject + "\n" + $url)}' \
          | curl -sS --fail-with-body -X POST \
              -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK"
