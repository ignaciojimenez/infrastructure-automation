---
name: Ansible Lint

on:
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - "scripts/**"
      # templates/ holds sshd_config.j2 and friends. The Jinja syntax check
      # below already globs them, but without this a templates-only change
      # never triggered the workflow that checks it.
      - "templates/**"
      - "tests/**"
      - ".ansible-lint"
      - ".github/workflows/ansible-lint.yml"
  pull_request:
    paths:
      - "ansible/**"
      - "scripts/**"
      # templates/ holds sshd_config.j2 and friends. The Jinja syntax check
      # below already globs them, but without this a templates-only change
      # never triggered the workflow that checks it.
      - "templates/**"
      - "tests/**"
      - ".ansible-lint"
      - ".github/workflows/ansible-lint.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # Override ansible.cfg's vault_password_file (bin/vault_pass.sh reads the
      # macOS Keychain, which doesn't exist on the Linux runner — exits 127).
      ANSIBLE_VAULT_PASSWORD_FILE: ${{ github.workspace }}/.ansible-ci-vault-pass
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Install Ansible collections
        run: ansible-galaxy collection install community.general community.docker ansible.posix

      - name: Create vault password file for CI
        run: echo "ci-dummy" > "$ANSIBLE_VAULT_PASSWORD_FILE"

      - name: Create minimal inventory for syntax check
        run: |
          cp ansible/inventory/hosts.yml.example ansible/inventory/hosts.yml
          cp ansible/inventory/group_vars/all/main.yml.example ansible/inventory/group_vars/all/main.yml
          cp ansible/inventory/group_vars/all/vault.yml.example ansible/inventory/group_vars/all/vault.yml
          # Encrypt dummy vault so ansible-vault can parse it
          ansible-vault encrypt ansible/inventory/group_vars/all/vault.yml

      - name: Run ansible-lint
        run: ansible-lint

      - name: Jinja2 syntax check — all .j2 templates
        run: python3 scripts/ci/check_jinja_syntax.py

      - name: Syntax check — main playbooks
        run: |
          for pb in ansible/playbooks/*.yml; do
            echo "Checking: $pb"
            ansible-playbook "$pb" --syntax-check
          done

      - name: ShellCheck the test harness
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # Scoped to tests/ deliberately. scripts/ is not clean yet — it has
          # SC2155s in enhanced_monitoring_wrapper and a Jinja-templated .sh
          # that shellcheck reads as literal braces — so widening this needs a
          # cleanup pass first, not a broken pipeline.
          # SC1091 is excluded: the cases source ../lib/harness.sh at runtime on
          # the container, a path shellcheck cannot follow from the repo.
          shellcheck -e SC1091 tests/*.sh tests/lib/*.sh tests/cases/*.sh tests/unit/*.sh

      - name: Validate role structure
        run: |
          failed=0
          for role in ansible/roles/services/*/; do
            role_name=$(basename "$role")
            # Skip the skeleton role
            [ "$role_name" = "_skeleton" ] && continue
            if [ ! -f "$role/tasks/main.yml" ]; then
              echo "FAIL: $role missing tasks/main.yml"
              failed=1
            fi
            if [ ! -f "$role/defaults/main.yml" ]; then
              echo "FAIL: $role missing defaults/main.yml"
              failed=1
            fi
          done
          exit $failed

      # Last step on purpose: everything above must have had its chance to fail.
      #
      # Why this exists at all — CI caught the shellcheck fault on all 22 pushes
      # between 18 and 29 Aug and emailed every one, and those emails arrived.
      # Nothing went undetected and nothing went unsent; the repo stayed broken
      # for eleven days purely because email is not a channel that produces
      # action here. #home-alerts is. See docs/TODO.md item 25.
      #
      # Gated to failures on a push to main, and nothing else. A red branch is
      # the author's problem while they are already watching it; a red main is
      # the thing that went unnoticed. Alerting on both would turn the one
      # watched channel into a second #home-logging, which is the exact failure
      # being fixed here.
      # Quoted: an unquoted " #" opens a YAML comment, which silently truncated
      # this name to "Alert" and left the rest as a comment ansible-lint rejected.
      - name: "Alert #home-alerts when main goes red"
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Read through env, never interpolated into the script below: a commit
          # message is untrusted input and ${{ }} inside `run` is shell injection.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "SLACK_ALERT_WEBHOOK is not set, so this failure was not announced."
            echo "Set it with: gh secret set SLACK_ALERT_WEBHOOK"
            exit 1
          fi
          short_sha=$(printf '%s' "$COMMIT_SHA" | cut -c1-7)
          subject=$(printf '%s' "$COMMIT_MSG" | head -1)
          # jq builds the payload so quotes or newlines in a commit subject
          # cannot break out of the JSON string.
          jq -n --arg sha "$short_sha" --arg subject "$subject" --arg url "$RUN_URL" \
            '{text: ("🔴 *CI red on main* — infrastructure-automation\n`" + $sha + "` " + $subject + "\n" + $url)}' \
          | curl -sS --fail-with-body -X POST \
              -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK"
