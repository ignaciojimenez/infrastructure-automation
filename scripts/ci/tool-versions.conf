# The lint toolchain, pinned once for every place scripts/ci/lint.sh runs:
# CI (.github/workflows/ansible-lint.yml), the unattended builder on the
# workbench (roles/services/workbench), and the laptop. lint.sh refuses to run
# on any other version (scripts/ci/check_tool_versions.sh).
#
# Why: on 2026-11-01 the workbench's Debian shellcheck 0.10 called a finding
# SC2317 that 0.11 calls SC2329, and the builder's lint failed on a main that
# CI passed. A linter's verdict is only as portable as its version.
#
# To bump: change a value here, update the laptop to match (brew), run
# scripts/ci/lint.sh, merge, then redeploy the workbench:
#   ansible-playbook ansible/playbooks/services.yml -l workbench-lxc -t packages,ansible
#
# KEY=VALUE only: CI sources it, Ansible reads it with the ini lookup.

SHELLCHECK_VERSION=0.11.0
# sha256 of shellcheck-v<version>.linux.x86_64.tar.gz on the GitHub release,
# checked against the digest GitHub publishes for the asset.
SHELLCHECK_SHA256=b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6

ANSIBLE_LINT_VERSION=26.10.1
